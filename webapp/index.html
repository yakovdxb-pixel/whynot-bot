<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WHY NOT? OS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #0f0f0f);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --sep: color-mix(in srgb, var(--hint) 25%, transparent);
    --st-pending:#8a8a8e;
    --st-in_progress:#2481cc;
    --st-done:#34c759;
    --st-overdue:#ff3b30;
    --st-cancelled:#8a8a8e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    padding:14px 16px 10px; border-bottom:1px solid var(--sep);
    display:flex; align-items:center; justify-content:space-between;
  }
  header h1{font-size:18px; font-weight:700; margin:0}
  header .sub{font-size:12px; color:var(--hint); margin-top:2px}
  .refresh{
    background:none; border:none; color:var(--link);
    font-size:22px; padding:4px 6px; cursor:pointer; line-height:1;
  }
  main{padding:14px 16px}
  .section-title{font-size:13px; font-weight:600; color:var(--hint);
    text-transform:uppercase; letter-spacing:.04em; margin:18px 2px 8px}
  .section-title:first-child{margin-top:4px}

  .card{
    background:var(--card); border-radius:14px; padding:13px 14px;
    margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .card .row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .card .title{font-weight:600; font-size:15px; margin:0}
  .card .desc{color:var(--hint); font-size:13px; margin:5px 0 0; white-space:pre-wrap}
  .card .meta{color:var(--hint); font-size:12px; margin-top:7px; display:flex; gap:10px; flex-wrap:wrap}

  .pill{
    display:inline-block; font-size:11px; font-weight:600; padding:3px 9px;
    border-radius:999px; color:#fff; white-space:nowrap; text-transform:lowercase;
  }
  .pill.pending{background:var(--st-pending)}
  .pill.in_progress{background:var(--st-in_progress)}
  .pill.done{background:var(--st-done)}
  .pill.overdue{background:var(--st-overdue)}
  .pill.cancelled{background:var(--st-cancelled)}
  .pill.stage{background:var(--link)}

  button.act{
    margin-top:11px; width:100%; border:none; border-radius:10px;
    background:var(--btn); color:var(--btn-text);
    font-size:14px; font-weight:600; padding:10px; cursor:pointer;
  }
  button.act:active{opacity:.7}
  button.act.ghost{background:transparent; color:var(--link); border:1px solid var(--sep)}
  button.act[disabled]{opacity:.45; cursor:default}

  .vote{
    display:flex; align-items:center; gap:6px; border:1px solid var(--sep);
    background:transparent; color:var(--text); border-radius:999px;
    padding:6px 12px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .vote.on{background:var(--btn); color:var(--btn-text); border-color:transparent}

  .empty{color:var(--hint); text-align:center; padding:34px 10px; font-size:14px}
  .loader{color:var(--hint); text-align:center; padding:34px 10px}
  .err{
    background:color-mix(in srgb, var(--st-overdue) 14%, transparent);
    color:var(--st-overdue); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:10px;
  }

  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; background:var(--bg); border-top:1px solid var(--sep);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; background:none; border:none; cursor:pointer;
    padding:8px 0 6px; color:var(--hint); font-size:11px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav button .ic{font-size:21px; line-height:1}
  nav button.active{color:var(--link)}

  .toast{
    position:fixed; left:50%; bottom:78px; transform:translateX(-50%);
    background:#000; color:#fff; padding:9px 16px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20;
    max-width:88%;
  }
  .toast.show{opacity:.92}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="screenTitle">Главная</h1>
    <div class="sub" id="whoami">…</div>
  </div>
  <button class="refresh" id="refreshBtn" aria-label="Обновить">⟳</button>
</header>

<main id="view"><div class="loader">Загрузка…</div></main>

<nav>
  <button data-tab="home"     class="active"><span class="ic">🏠</span>Главная</button>
  <button data-tab="content"><span class="ic">📋</span>Контент</button>
  <button data-tab="ideas"><span class="ic">💡</span>Идеи</button>
  <button data-tab="blockers"><span class="ic">🚫</span>Блокеры</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
const INIT_DATA = (tg && tg.initData) || "";

const TITLES = { home:"Главная", content:"Контент", ideas:"Идеи", blockers:"Блокеры" };
const PIPELINE_LABELS = {
  idea:"Идея", approval:"Согласование", script:"Сценарий", shoot:"Съёмка",
  edit:"Монтаж", review:"Ревью", client:"У клиента", revisions:"Правки",
  done:"Готово", published:"Опубликовано", analytics:"Аналитика"
};
const STATUS_LABELS = {
  pending:"ожидает", in_progress:"в работе", done:"готово",
  overdue:"просрочено", cancelled:"отменено"
};

const view = document.getElementById("view");
const screenTitle = document.getElementById("screenTitle");
let currentTab = "home";
let busy = false;

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}
function haptic(kind){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind||"light"); }catch(e){} }

async function api(path, opts){
  opts = opts || {};
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: {
      "Content-Type": "application/json",
      "X-Init-Data": INIT_DATA,
      "X-Telegram-Init-Data": INIT_DATA,
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok){
    const msg = (data && (data.detail || data.message)) || ("Ошибка " + res.status);
    throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
  }
  return data;
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]
));
function fmtDate(v){
  if(!v) return null;
  const d = new Date(v);
  if(isNaN(d)) return String(v);
  return d.toLocaleDateString("ru-RU", {day:"2-digit", month:"short"});
}
function deadlineMeta(v){
  const f = fmtDate(v);
  return f ? `⏰ ${f}` : "⏰ без срока";
}

function taskCard(t, {withAction=true}={}){
  const st = t.status || "pending";
  const done = st === "done" || st === "cancelled";
  return `
  <div class="card" data-task="${t.id}">
    <div class="row">
      <p class="title">${esc(t.title || "Без названия")}</p>
      <span class="pill ${esc(st)}">${esc(STATUS_LABELS[st] || st)}</span>
    </div>
    ${t.description ? `<p class="desc">${esc(t.description)}</p>` : ""}
    <div class="meta">
      <span>${deadlineMeta(t.deadline)}</span>
      ${t.assignee_name ? `<span>👤 ${esc(t.assignee_name)}</span>` : ""}
      ${t.priority && t.priority !== "normal" ? `<span>❗ ${esc(t.priority)}</span>` : ""}
    </div>
    ${withAction && !done ? `<button class="act" data-done="${t.id}">Готово</button>` : ""}
  </div>`;
}

function blockerCard(b){
  return `
  <div class="card">
    <div class="row">
      <p class="title">🚫 ${esc(b.title || "Блокер")}</p>
    </div>
    ${b.description ? `<p class="desc">${esc(b.description)}</p>` : ""}
    <div class="meta">
      ${b.reported_by_name ? `<span>сообщил: ${esc(b.reported_by_name)}</span>` : ""}
      ${b.assigned_to_name ? `<span>на: ${esc(b.assigned_to_name)}</span>` : ""}
      ${b.created_at ? `<span>${esc(fmtDate(b.created_at))}</span>` : ""}
    </div>
  </div>`;
}

/* ── screens ─────────────────────────────────────────────── */

async function renderHome(){
  const d = await api("/api/home");
  setWhoami(d.user);
  const parts = [];

  parts.push(`<div class="section-title">Мои задачи</div>`);
  parts.push(d.my_tasks.length
    ? d.my_tasks.map(t => taskCard(t)).join("")
    : `<div class="empty">Нет активных задач 🎉</div>`);

  parts.push(`<div class="section-title">Мои блокеры</div>`);
  parts.push(d.my_blockers.length
    ? d.my_blockers.map(blockerCard).join("")
    : `<div class="empty">Блокеров нет</div>`);

  if (d.my_content && d.my_content.length){
    parts.push(`<div class="section-title">Мой контент</div>`);
    parts.push(d.my_content.map(c => contentCard(c, {advance:false})).join(""));
  }
  view.innerHTML = parts.join("");
}

function contentCard(c, {advance=true}={}){
  const st = c.pipeline_status || "idea";
  const isFinal = st === "analytics";
  return `
  <div class="card" data-content="${c.id}">
    <div class="row">
      <p class="title">${esc(c.topic || c.number || ("Контент #" + c.id))}</p>
      <span class="pill stage">${esc(PIPELINE_LABELS[st] || st)}</span>
    </div>
    ${c.description ? `<p class="desc">${esc(c.description)}</p>` : ""}
    <div class="meta">
      ${c.format ? `<span>🎞 ${esc(c.format)}</span>` : ""}
      ${c.publish_date ? `<span>📅 ${esc(fmtDate(c.publish_date))}</span>` : ""}
      ${c.client_approved ? `<span>✅ клиент</span>` : ""}
    </div>
    ${advance && !isFinal ? `<button class="act" data-advance="${c.id}">Продвинуть →</button>` : ""}
    ${advance && isFinal ? `<button class="act ghost" disabled>Финальный этап</button>` : ""}
  </div>`;
}

async function renderContent(){
  const items = await api("/api/content");
  if (!items.length){ view.innerHTML = `<div class="empty">Контента пока нет</div>`; return; }
  const order = ["idea","approval","script","shoot","edit","review","client","revisions","done","published","analytics"];
  const groups = {};
  items.forEach(c => { (groups[c.pipeline_status] ||= []).push(c); });
  const parts = [];
  order.forEach(st => {
    if (!groups[st]) return;
    parts.push(`<div class="section-title">${PIPELINE_LABELS[st] || st} · ${groups[st].length}</div>`);
    parts.push(groups[st].map(c => contentCard(c)).join(""));
  });
  view.innerHTML = parts.join("");
}

async function renderIdeas(){
  const ideas = await api("/api/ideas");
  if (!ideas.length){ view.innerHTML = `<div class="empty">Идей пока нет — предложи первую в боте</div>`; return; }
  view.innerHTML = ideas.map(i => `
    <div class="card">
      <div class="row">
        <p class="title">💡 ${esc(i.title || "Идея")}</p>
        <button class="vote ${i.voted ? "on":""}" data-vote="${i.id}">👍 <span>${i.votes_count||0}</span></button>
      </div>
      ${i.description ? `<p class="desc">${esc(i.description)}</p>` : ""}
      <div class="meta">
        ${i.format ? `<span>🎞 ${esc(i.format)}</span>` : ""}
        ${i.proposed_by_name ? `<span>от ${esc(i.proposed_by_name)}</span>` : ""}
        ${i.status ? `<span>${esc(i.status)}</span>` : ""}
      </div>
    </div>`).join("");
}

async function renderBlockers(){
  const list = await api("/api/blockers");
  view.innerHTML = list.length
    ? list.map(blockerCard).join("")
    : `<div class="empty">Активных блокеров нет 👌</div>`;
}

const RENDERERS = { home:renderHome, content:renderContent, ideas:renderIdeas, blockers:renderBlockers };

function setWhoami(u){
  const el = document.getElementById("whoami");
  if(!u){ el.textContent = INIT_DATA ? "" : "dev-режим"; return; }
  const bits = [u.full_name || "—"];
  if (u.role) bits.push(u.role);
  if (!u.registered) bits.push("не зарегистрирован");
  el.textContent = bits.join(" · ");
}

async function load(tab){
  currentTab = tab;
  screenTitle.textContent = TITLES[tab];
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === tab));
  view.innerHTML = `<div class="loader">Загрузка…</div>`;
  try {
    await RENDERERS[tab]();
  } catch (e){
    view.innerHTML = `<div class="err">${esc(e.message || "Не удалось загрузить")}</div>`;
  }
}

/* ── events ──────────────────────────────────────────────── */

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) { haptic(); load(b.dataset.tab); }
});
document.getElementById("refreshBtn").addEventListener("click", () => { haptic(); load(currentTab); });

view.addEventListener("click", async e => {
  const doneBtn = e.target.closest("[data-done]");
  const advBtn = e.target.closest("[data-advance]");
  const voteBtn = e.target.closest("[data-vote]");
  if (busy) return;

  if (doneBtn){
    busy = true; doneBtn.disabled = true; doneBtn.textContent = "…";
    try {
      await api(`/api/tasks/${doneBtn.dataset.done}`, {method:"PATCH", body:{status:"done"}});
      haptic("medium"); toast("Задача закрыта");
      await load(currentTab);
    } catch(err){ toast(err.message); doneBtn.disabled = false; doneBtn.textContent = "Готово"; }
    finally { busy = false; }
  }

  if (advBtn){
    busy = true; advBtn.disabled = true; advBtn.textContent = "…";
    try {
      const r = await api(`/api/content/${advBtn.dataset.advance}/advance`, {method:"POST"});
      haptic("medium"); toast("→ " + (PIPELINE_LABELS[r.pipeline_status] || r.pipeline_status));
      await load(currentTab);
    } catch(err){ toast(err.message); advBtn.disabled = false; advBtn.textContent = "Продвинуть →"; }
    finally { busy = false; }
  }

  if (voteBtn){
    busy = true;
    try {
      const r = await api(`/api/ideas/${voteBtn.dataset.vote}/vote`, {method:"POST"});
      haptic();
      voteBtn.classList.toggle("on", r.voted);
      voteBtn.querySelector("span").textContent = r.votes_count;
    } catch(err){ toast(err.message); }
    finally { busy = false; }
  }
});

load("home");
</script>
</body>
</html>
