<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WHY NOT? OS</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1a0820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WHY NOT? OS">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    /* WHY NOT? brand — fixed dark plum theme */
    --bg:#1a0820;
    --card:#2c1636;
    --text:#f4eff7;
    --hint:#a290ae;
    --link:#25dcac;
    --btn:#1ec89a;
    --btn-text:#04231b;
    --sep:rgba(255,255,255,.10);
    --st-pending:#8f8f96;
    --st-in_progress:#4aa3ff;
    --st-done:#2ecb6a;
    --st-overdue:#ff5147;
    --st-cancelled:#8f8f96;
    --fab:#1ec89a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0; padding:0;
    background:var(--bg); color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    overflow:hidden; overscroll-behavior:none;
  }
  /* --- title bar: a normal thin row; in fullscreen it floats between
         Telegram's Close pill and the ⋯ menu, reclaiming the whole row --- */
  #fsSpacer{flex:0 0 auto; height:0}
  html.fs #fsSpacer{height:calc(var(--sa-top, 0px) + var(--csa-top, 0px))}

  #brandbar{
    flex:0 0 auto; background:var(--bg);
    padding:6px calc(16px + var(--safe-right, 0px)) 7px calc(16px + var(--safe-left, 0px));
    border-bottom:1px solid var(--sep);
    font-size:13px; color:var(--hint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #brandbar b{color:var(--text); font-weight:700; font-size:15px}
  #whoami:not(:empty)::before{content:" · "; color:var(--hint)}

  html.fs #brandbar{
    position:fixed; left:50%; transform:translateX(-50%);
    top:calc(var(--sa-top, 0px) + 1px);
    padding:0; border:none; background:transparent; z-index:40;
    max-width:60vw; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; line-height:1.15;
  }
  html.fs #brandbar b{font-size:13px}
  html.fs #whoami{font-size:10px; color:var(--hint); text-transform:lowercase}
  html.fs #whoami::before{content:none}

  #ptr{
    flex:0 0 auto; height:0; overflow:hidden;
    display:flex; align-items:flex-end; justify-content:center;
    color:var(--hint); font-size:18px;
  }
  #ptr.anim{transition:height .2s}
  #ptr.spin span{display:inline-block; animation:ptrspin .8s linear infinite}
  @keyframes ptrspin{to{transform:rotate(360deg)}}

  .no-access{text-align:center; padding:60px 24px}
  .no-access .na-emoji{font-size:44px}
  .no-access .na-title{font-size:19px; font-weight:700; margin:14px 0 6px}
  .no-access .na-sub{color:var(--hint); font-size:14px; margin:0 0 16px}
  .no-access .na-id{
    font-size:22px; font-weight:800; letter-spacing:.5px;
    background:var(--card); color:var(--text); border:1px solid var(--sep);
    border-radius:12px; padding:12px 22px; cursor:pointer;
  }
  .no-access .na-hint{color:var(--hint); font-size:12px; margin-top:8px}

  main#view{
    flex:1 1 auto; min-height:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    padding:14px 16px calc(96px + env(safe-area-inset-bottom));
  }
  .section-title{font-size:13px; font-weight:600; color:var(--hint);
    text-transform:uppercase; letter-spacing:.04em; margin:18px 2px 8px}
  .section-title:first-child{margin-top:4px}

  .card{
    background:var(--card); border:1px solid rgba(255,255,255,.05); border-radius:14px;
    padding:13px 14px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,.35);
  }
  .card .row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .card .title{font-weight:600; font-size:15px; margin:0}
  .card .desc{color:var(--hint); font-size:13px; margin:5px 0 0; white-space:pre-wrap}
  .card .meta{color:var(--hint); font-size:12px; margin-top:7px; display:flex; gap:10px; flex-wrap:wrap}

  .pill{
    display:inline-block; font-size:11px; font-weight:600; padding:3px 9px;
    border-radius:999px; color:#fff; white-space:nowrap; text-transform:lowercase;
  }
  .pill.pending{background:var(--st-pending)}
  .pill.in_progress{background:var(--st-in_progress)}
  .pill.done{background:var(--st-done)}
  .pill.overdue{background:var(--st-overdue)}
  .pill.cancelled{background:var(--st-cancelled)}
  .pill.stage{background:var(--link)}

  button.act{
    margin-top:11px; width:100%; border:none; border-radius:10px;
    background:var(--btn); color:var(--btn-text);
    font-size:14px; font-weight:600; padding:10px; cursor:pointer;
  }
  button.act:active{opacity:.7}
  button.act.ghost{background:transparent; color:var(--link); border:1px solid var(--sep)}
  button.act[disabled]{opacity:.45; cursor:default}

  .seg{
    display:flex; background:var(--card); border-radius:10px; padding:3px;
    margin:2px 0 12px;
  }
  .seg button{
    flex:1; border:none; background:none; color:var(--hint); cursor:pointer;
    font-size:13px; font-weight:600; padding:7px 0; border-radius:8px;
  }
  .seg{background:rgba(0,0,0,.28)}
  .seg button.on{background:var(--card); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.4)}

  .done-mark{margin-top:10px; text-align:center; color:var(--st-done); font-weight:600; font-size:14px}

  .pills-row{
    display:flex; gap:6px; overflow-x:auto; margin:2px 0 12px; padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
  }
  .pills-row::-webkit-scrollbar{display:none}
  .pill-btn{
    flex:0 0 auto; border:1px solid var(--sep); background:transparent; color:var(--hint);
    border-radius:999px; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .pill-btn.on{background:var(--btn); color:var(--btn-text); border-color:transparent}

  .client-card .row{cursor:pointer}
  .proj-block{margin-top:12px; border-top:1px solid var(--sep); padding-top:10px}
  .proj-item{font-size:14px; padding:5px 0}
  .proj-item .hint{color:var(--hint)}
  .proj-form{margin-top:8px; display:flex; flex-direction:column; gap:8px}
  .proj-form input, .proj-form textarea{
    width:100%; font:14px inherit; color:var(--text); background:var(--bg);
    border:1px solid var(--sep); border-radius:9px; padding:8px 10px; outline:none;
  }
  .proj-form textarea{min-height:52px; resize:vertical}

  .vote{
    display:flex; align-items:center; gap:6px; border:1px solid var(--sep);
    background:transparent; color:var(--text); border-radius:999px;
    padding:6px 12px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .vote.on{background:var(--btn); color:var(--btn-text); border-color:transparent}

  .empty{color:var(--hint); text-align:center; padding:34px 10px; font-size:14px}
  .loader{color:var(--hint); text-align:center; padding:34px 10px}
  .err{
    background:color-mix(in srgb, var(--st-overdue) 14%, transparent);
    color:var(--st-overdue); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:10px;
  }

  nav{
    flex:0 0 auto; z-index:10;
    display:flex; background:var(--bg); border-top:1px solid var(--sep);
    padding-bottom:calc(var(--safe-bottom, 0px) + env(safe-area-inset-bottom));
  }
  nav button{
    flex:1 1 0; min-width:0; background:none; border:none; cursor:pointer;
    padding:7px 1px 6px; color:var(--hint); font-size:9px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav button span:last-child{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  nav button .ic{font-size:19px; line-height:1}
  nav button.active{color:var(--link)}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px}
  .stat{background:var(--card); border-radius:14px; padding:13px 14px; box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .stat .n{font-size:26px; font-weight:800; line-height:1.1}
  .stat .l{font-size:12px; color:var(--hint); margin-top:4px}

  .wl-row{background:var(--card); border-radius:12px; padding:11px 13px; margin-bottom:8px}
  .wl-top{display:flex; justify-content:space-between; align-items:baseline; font-size:14px}
  .wl-top .open{color:var(--hint); font-size:12px}
  .bar{height:7px; border-radius:4px; background:var(--sep); margin-top:8px; overflow:hidden}
  .bar > i{display:block; height:100%; border-radius:4px}
  .bar-g{background:var(--st-done)} .bar-y{background:#ffcc00} .bar-r{background:var(--st-overdue)}
  .wl-sub{font-size:11px; color:var(--hint); margin-top:5px}

  .pipe-bar{display:flex; height:26px; border-radius:8px; overflow:hidden; margin:4px 0 8px}
  .pipe-seg{display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; min-width:22px}
  .pipe-legend{display:flex; flex-wrap:wrap; gap:8px 14px; font-size:11px; color:var(--hint)}
  .pipe-legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:middle}

  .act-row{font-size:13px; padding:8px 0; border-bottom:1px solid var(--sep)}
  .act-row:last-child{border-bottom:none}
  .act-row .ago{color:var(--hint); font-size:11px; margin-left:4px}

  .card.tappable{cursor:pointer}
  .card.tappable:active{opacity:.75}
  #memberSheet select, #memberSheet input{
    width:100%; font:15px inherit; color:var(--text);
    background:var(--card); border:1px solid var(--sep); border-radius:10px;
    padding:10px 12px; outline:none; -webkit-appearance:none; appearance:none;
  }
  #memberSheet input:focus, #memberSheet select:focus{border-color:var(--link)}
  #memberSheet #memberDelete{color:var(--st-overdue); border-color:color-mix(in srgb, var(--st-overdue) 45%, transparent)}
  #memberSheet #memberDelete[hidden]{display:none}

  /* multi-assignee picker */
  .mpick{display:flex; flex-wrap:wrap; gap:7px}
  .mp-opt{
    border:1px solid var(--sep); background:transparent; color:var(--text);
    border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .mp-opt.on{background:var(--btn); color:var(--btn-text); border-color:transparent}

  /* references */
  .ref-row{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap}
  .ref-thumb{position:relative; flex:0 0 auto; line-height:0}
  .ref-mini{width:44px; height:44px; object-fit:cover; border-radius:8px; cursor:pointer; display:block; background:var(--sep)}
  .ref-x{
    position:absolute; top:-7px; right:-7px; width:19px; height:19px; padding:0;
    border:2px solid var(--bg); border-radius:50%; background:#d23a2e; color:#fff;
    font-size:11px; line-height:15px; cursor:pointer; z-index:2;
  }
  .ref-open{
    flex:0 0 auto; border:1px dashed var(--sep); background:transparent;
    color:var(--hint); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  /* refs widget inside the create form */
  .refs-field .rf-list{display:flex; flex-direction:column; gap:6px; margin-bottom:8px}
  .refs-field .rf-list:empty{display:none}
  .rf-item{display:flex; align-items:center; gap:8px; background:var(--card);
    border:1px solid var(--sep); border-radius:8px; padding:8px 10px; font-size:13px}
  .rf-item .rf-t{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rf-item button{border:none; background:none; color:var(--st-overdue,#d23a2e); font-size:14px; cursor:pointer; flex:0 0 auto}
  .rf-row{display:flex; gap:6px}
  .rf-row input{flex:1 1 auto}
  .rf-actions{display:flex; gap:8px; margin-top:6px}
  #refSheet #refList{display:flex; flex-direction:column; gap:8px; margin-bottom:12px}
  #refSheet #refList:empty{display:none}
  .ref-item{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border-radius:10px; padding:10px 12px;
  }
  .ref-item .ri-main{flex:1 1 auto; min-width:0; overflow:hidden}
  .ref-item .ri-main a{color:var(--link); text-decoration:none; word-break:break-all}
  .ref-item .ri-name{color:var(--text); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ref-item .ri-sub{color:var(--hint); font-size:11px; margin-top:2px}
  .ref-item img.ri-thumb{width:44px; height:44px; object-fit:cover; border-radius:8px; flex:0 0 auto}
  .ref-item .ri-del{flex:0 0 auto; background:none; border:none; color:var(--st-overdue); font-size:16px; cursor:pointer; padding:4px}
  #refSheet input{
    width:100%; font:15px inherit; color:var(--text);
    background:var(--card); border:1px solid var(--sep); border-radius:10px;
    padding:10px 12px; outline:none;
  }
  #refSheet input:focus{border-color:var(--link)}
  #refSheet #refLinkForm[hidden]{display:none}
  .ref-actions{display:flex; gap:8px}
  .ref-actions .act{flex:1}

  #installBanner{
    display:flex; align-items:center; gap:10px;
    background:#6c5ce7; color:#fff;
    padding:10px 12px; font-size:13px; line-height:1.35;
  }
  #installBanner[hidden]{display:none}
  #installBanner #installText{flex:1}
  #installBanner #installBtn{
    flex:0 0 auto; border:none; border-radius:8px; cursor:pointer;
    background:#fff; color:#6c5ce7; font-size:13px; font-weight:700; padding:8px 12px;
  }
  #installBanner #installBtn[hidden]{display:none}
  #installBanner #installClose{
    flex:0 0 auto; border:none; background:transparent; color:#fff;
    font-size:20px; line-height:1; cursor:pointer; padding:0 2px;
  }

  .toast{
    position:fixed; left:50%; bottom:calc(78px + var(--safe-bottom, 0px)); transform:translateX(-50%);
    background:#000; color:#fff; padding:9px 16px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20;
    max-width:88%;
  }
  .toast.show{opacity:.92}

  /* ── floating + button ─────────────────────────────────── */
  .fab{
    position:fixed; right:16px; z-index:15;
    bottom:calc(64px + 14px + var(--safe-bottom, 0px) + env(safe-area-inset-bottom));
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:var(--fab, #ff6b5e); color:#fff; font-size:28px; line-height:52px;
    box-shadow:0 4px 14px rgba(0,0,0,.28); padding:0;
    transition:transform .12s;
  }
  .fab:active{transform:scale(.9)}

  /* ── bottom-sheet modal ────────────────────────────────── */
  .sheet-backdrop{
    position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto}
  .sheet{
    /* milky-cream sheet theme — scoped var overrides cascade to every child */
    --bg:#f4efe3;
    --text:#241a22;
    --hint:#8a7f86;
    --card:#ffffff;
    --sep:rgba(20,8,20,.14);
    --link:#0b7a5c;
    --st-overdue:#d23a2e;
    position:fixed; left:0; right:0; bottom:0; z-index:31;
    background:var(--bg); color:var(--text);
    border-radius:16px 16px 0 0; padding:0 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .26s cubic-bezier(.32,.72,0,1);
    max-height:88vh; overflow-y:auto;
  }
  .sheet.open{transform:translateY(0)}
  .sheet .hint{color:var(--hint); font-size:13px}
  .sheet-head{
    position:sticky; top:0; z-index:3; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:14px 0 8px; margin:0; cursor:pointer;
    touch-action:none;
  }
  .sheet .grabber{width:40px; height:5px; border-radius:3px; background:var(--sep);
    margin:0 auto; transition:width .15s, background .15s}
  .sheet-head:active .grabber{width:52px; background:var(--hint)}
  .sheet h2{font-size:17px; font-weight:700; margin:6px 0 14px; line-height:1.35; padding-top:2px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12px; color:var(--hint); margin-bottom:5px}
  .field input, .field textarea, .field select{
    width:100%; font:15px inherit; color:var(--text);
    background:var(--card); border:1px solid var(--sep); border-radius:10px;
    padding:10px 12px; outline:none; -webkit-appearance:none; appearance:none;
  }
  .field textarea{min-height:74px; resize:vertical}
  .field select{background-image:none}
  .field input::placeholder, .field textarea::placeholder,
  .proj-form input::placeholder, .proj-form textarea::placeholder{color:var(--hint)}
  .field select option{background:var(--card); color:var(--text)}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--link)}
  .field.bad input, .field.bad textarea, .field.bad select{border-color:var(--st-overdue)}
  .sheet .form-err{
    background:color-mix(in srgb, var(--st-overdue) 14%, transparent);
    color:var(--st-overdue); border-radius:10px; padding:9px 12px; font-size:13px; margin-bottom:10px;
  }
  .sheet .submit{
    width:100%; border:none; border-radius:12px; margin-top:4px;
    background:var(--btn); color:var(--btn-text); font-size:15px; font-weight:600;
    padding:13px; cursor:pointer;
  }
  .sheet .submit[disabled]{opacity:.55; cursor:default}
  .more-item{
    display:flex; align-items:center; gap:12px; width:100%;
    background:var(--card); border:1px solid var(--sep); border-radius:12px;
    color:var(--text); font:15px inherit; font-weight:600;
    padding:14px 16px; margin-bottom:10px; cursor:pointer; text-align:left;
  }
  .more-item span{font-size:19px}
</style>
</head>
<body>
<div id="fsSpacer"></div>
<div id="brandbar">
  <span id="screenTitle" hidden></span>
  <b id="screenLabel">Главная</b><span id="whoami"></span>
</div>

<div id="installBanner" hidden>
  <span id="installText"></span>
  <button id="installBtn" hidden>📲 Установить приложение</button>
  <button id="installClose" aria-label="Закрыть">×</button>
</div>

<div id="ptr"><span>⟳</span></div>
<main id="view"><div class="loader">Загрузка…</div></main>

<nav>
  <button data-tab="home" class="active"><span class="ic">🏠</span><span data-i18n="nav.home">Главная</span></button>
  <button data-tab="content"><span class="ic">📋</span><span data-i18n="nav.content">Контент</span></button>
  <button data-tab="ideas"><span class="ic">💡</span><span data-i18n="nav.ideas">Идеи</span></button>
  <button data-tab="shoots"><span class="ic">🎬</span><span data-i18n="nav.shoots">Съёмки</span></button>
  <button id="navMore"><span class="ic">⋯</span><span data-i18n="nav.more">Ещё</span></button>
</nav>

<button class="fab" id="fab" aria-label="Создать">+</button>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-head" data-dismiss><div class="grabber"></div></div>
  <h2 id="sheetTitle"></h2>
  <div class="form-err" id="formErr" style="display:none"></div>
  <div id="formFields"></div>
  <button class="submit" id="formSubmit">Создать</button>
</div>

<div class="sheet-backdrop" id="memberBackdrop"></div>
<div class="sheet" id="memberSheet" role="dialog" aria-modal="true">
  <div class="sheet-head" data-dismiss><div class="grabber"></div></div>
  <h2 id="memberName"></h2>
  <div class="field"><label data-i18n="field.full_name">Имя</label><input id="memberFullName" type="text"></div>
  <div class="field"><label data-i18n="field.role">Роль</label><select id="memberRole"></select></div>
  <button class="submit" id="memberSave" data-i18n="btn.save">Сохранить</button>
  <button class="act ghost" id="memberDelete" style="margin-top:10px" data-i18n="member.delete">Удалить из команды</button>
</div>

<div class="sheet-backdrop" id="moreBackdrop"></div>
<div class="sheet" id="moreSheet" role="dialog" aria-modal="true">
  <div class="sheet-head" data-dismiss><div class="grabber"></div></div>
  <h2 data-i18n="nav.more">Ещё</h2>
  <button class="more-item" data-goto="blockers"><span>🚫</span> <span data-i18n="nav.blockers">Блокеры</span></button>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const INIT_DATA = (tg && tg.initData) || "";

/* make the Mini App feel solid inside Telegram */
(function tgChrome(){
  if (!tg) return;
  const atLeast = (v) => !tg.isVersionAtLeast || tg.isVersionAtLeast(v);
  try { tg.ready(); } catch(e){}
  try { tg.expand(); } catch(e){}
  // stop the swipe-down gesture that collapses / drags the app (Bot API 7.7+)
  try { if (atLeast("7.7") && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch(e){}
  // paint Telegram's top bar in the brand colour so it blends in
  try { if (tg.setHeaderColor) tg.setHeaderColor("#1a0820"); } catch(e){}
  try { if (tg.setBackgroundColor) tg.setBackgroundColor("#1a0820"); } catch(e){}

  // keep content clear of the notch + Telegram's floating controls
  const rootEl = document.documentElement;
  const root = rootEl.style;
  function applyInsets(){
    const s = tg.safeAreaInset || {};
    const c = tg.contentSafeAreaInset || {};
    const px = (n) => (n && n > 0 ? n + "px" : "0px");
    root.setProperty("--sa-top",       px(s.top || 0));                 // notch only
    root.setProperty("--csa-top",      px(c.top || 0));                 // Telegram controls
    root.setProperty("--safe-top",     px((s.top || 0) + (c.top || 0)));
    root.setProperty("--safe-bottom",  px((s.bottom || 0) + (c.bottom || 0)));
    root.setProperty("--safe-left",    px((s.left || 0) + (c.left || 0)));
    root.setProperty("--safe-right",   px((s.right || 0) + (c.right || 0)));
    rootEl.classList.toggle("fs", !!tg.isFullscreen);
  }
  ["safeAreaChanged", "contentSafeAreaChanged", "fullscreenChanged"].forEach((ev) => {
    try { tg.onEvent && tg.onEvent(ev, applyInsets); } catch(e){}
  });

  // open edge-to-edge for maximum working area (Bot API 8.0+)
  try {
    if (atLeast("8.0") && tg.requestFullscreen && !tg.isFullscreen){
      tg.requestFullscreen();
    }
  } catch(e){}
  applyInsets();
})();

/* ── install / add-to-home-screen banner ────────────────── */
(function installBanner(){
  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;
  const inTelegram = !!(tg && tg.initData);
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

  const bar   = document.getElementById("installBanner");
  const txt   = document.getElementById("installText");
  const btn   = document.getElementById("installBtn");
  const close = document.getElementById("installClose");
  let deferred = null;

  function dismissed(){ try { return localStorage.getItem("wn_install_dismissed") === "1"; } catch(e){ return false; } }
  function hide(){ bar.hidden = true; }
  function show(){ if (!isStandalone && !dismissed()) bar.hidden = false; }

  close.addEventListener("click", () => {
    try { localStorage.setItem("wn_install_dismissed", "1"); } catch(e){}
    hide();
  });

  if (isStandalone) return;

  // ── inside Telegram → use the native "Add to Home Screen" (Bot API 8.0+) ──
  if (inTelegram){
    const canAdd = tg && typeof tg.addToHomeScreen === "function" &&
                   (!tg.isVersionAtLeast || tg.isVersionAtLeast("8.0"));
    if (!canAdd) return;

    const offer = () => {
      txt.textContent = "Добавить WHY NOT? OS на главный экран";
      btn.textContent = "📲 Добавить";
      btn.hidden = false;
      show();
    };
    btn.addEventListener("click", () => { btn.disabled = true; try { tg.addToHomeScreen(); } catch(e){} });
    tg.onEvent && tg.onEvent("homeScreenAdded", hide);

    if (typeof tg.checkHomeScreenStatus === "function"){
      try {
        tg.checkHomeScreenStatus((status) => {
          if (status === "added" || status === "unsupported") hide();
          else offer();
        });
      } catch(e){ offer(); }
    } else {
      offer();
    }
    return;
  }

  // ── plain browser → PWA install ──
  if (isIOS){
    txt.innerHTML = 'Установи как приложение: <b>Поделиться</b> ⬆️ → <b>На экран «Домой»</b>';
    btn.hidden = true;
    show();
  }

  window.addEventListener("beforeinstallprompt", (e) => {   // Android / desktop Chrome
    e.preventDefault();
    deferred = e;
    txt.textContent = "Установить WHY NOT? OS на телефон";
    btn.hidden = false;
    show();
  });

  btn.addEventListener("click", async () => {
    if (!deferred) return;
    btn.disabled = true;
    deferred.prompt();
    try { await deferred.userChoice; } catch(e){}
    deferred = null;
    hide();
  });

  window.addEventListener("appinstalled", () => {
    try { localStorage.setItem("wn_install_dismissed", "1"); } catch(e){}
    hide();
  });
})();

             blockers:t("nav.blockers"), shoots:t("nav.shoots"), team:t("nav.team"), dash:t("nav.dash") };
  _setArr(PLATFORM_OPTS, [["","—"], ...opts("pf.", ["instagram","tiktok","youtube","telegram","vk","other"])]);
  _setArr(SHOOT_STATUS_OPTS, opts("ss.", ["planned","done","cancelled"]));
  _setArr(STATUS_OPTS, opts("st.", ["pending","in_progress","done","overdue","cancelled"]));
  _setArr(PIPELINE_OPTS, opts("pipe.", _PIPE));
  _setArr(PRIORITY_OPTS, opts("pr.", ["normal","high","urgent"]));
  _setArr(FORMAT_OPTS, opts("fmt.", _FMT));
  _setArr(FORMATOPT_OPTS, [["","—"], ...opts("fmt.", ["post","reels","story","carousel","other"])]);
  _setArr(ROLE_OPTS, _ROLES.map(r => [r, t("role."+r)]));
  ROLE_LABELS = {}; _ROLES.forEach(r => ROLE_LABELS[r] = t("role."+r));
  PIPELINE_LABELS = {}; _PIPE.forEach(p => PIPELINE_LABELS[p] = t("pipe."+p));
  STATUS_LABELS = {}; ["pending","in_progress","done","overdue","cancelled"].forEach(s => STATUS_LABELS[s] = t("st."+s));
  PLATFORM_LABEL = Object.fromEntries(PLATFORM_OPTS);
  SHOOT_STATUS_LABEL = Object.fromEntries(SHOOT_STATUS_OPTS);
  TASK_NEXT = {
    pending:     { to:"in_progress", label:t("tn.toWork") },
    overdue:     { to:"in_progress", label:t("tn.toWork") },
    in_progress: { to:"done",        label:t("tn.toDone") },
  };
}
buildLabels();

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}

async function api(path, opts){
  opts = opts || {};
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: {
      "Content-Type": "application/json",
      "X-Init-Data": INIT_DATA,
      "X-Telegram-Init-Data": INIT_DATA,
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok){
    const d = data && data.detail;
    const msg = (d && (typeof d === "string" ? d : d.message)) || (data && data.message) || ("Ошибка " + res.status);
    const err = new Error(msg);
    err.status = res.status;
    err.detail = d;
    throw err;
  }
  return data;
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]
));
function fmtDate(v){
  if(!v) return null;
  const d = new Date(v);
  if(isNaN(d)) return String(v);
  return d.toLocaleDateString("ru-RU", {day:"2-digit", month:"short"});
}
function fmtDateTime(v){
  if(!v) return null;
  const d = new Date(v);
  if(isNaN(d)) return String(v);
  return d.toLocaleString("ru-RU", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
}
function toLocalInput(v){
  // ISO -> "YYYY-MM-DDTHH:MM" for <input type=datetime-local>
  if(!v) return "";
  const d = new Date(v);
  if(isNaN(d)) return "";
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function deadlineMeta(v){
  const f = fmtDate(v);
  return f ? `⏰ ${f}` : "⏰ без срока";
}

function assigneesLabel(t){
  const names = (t.assignees || []).map(a => a.name).filter(Boolean);
  if (names.length) return "👤 " + esc(names.join(", "));
  return t.assignee_name ? "👤 " + esc(t.assignee_name) : "";
}

let taskById = {};
let contentById = {};

function refStrip(kind, id, count, thumbs){
  if (!count) return "";
  const t = (thumbs || []).map(x =>
    `<span class="ref-thumb">
       <img class="ref-mini" src="${esc(x.download)}?ia=${encodeURIComponent(INIT_DATA)}" alt="" data-refs="${kind}:${id}">
       <button class="ref-x" data-ref-del-card="${x.id}" aria-label="Удалить">✕</button>
     </span>`).join("");
  return `<div class="ref-row" data-refs="${kind}:${id}">
    ${t}
    <button class="ref-open" data-refs="${kind}:${id}">📎 ${count}</button>
  </div>`;
}

function taskCard(tk){
  taskById[tk.id] = tk;
  const st = tk.status || "pending";
  const next = TASK_NEXT[st];
  const who = assigneesLabel(tk);
  return `
  <div class="card tappable" data-task-edit="${tk.id}">
    <div class="row">
      <p class="title">${esc(tk.title || "—")}</p>
      <span class="pill ${esc(st)}">${esc(STATUS_LABELS[st] || st)}</span>
    </div>
    ${tk.description ? `<p class="desc">${esc(tk.description)}</p>` : ""}
    <div class="meta">
      <span>${deadlineMeta(tk.deadline)}</span>
      ${who ? `<span>${who}</span>` : ""}
      ${tk.priority && tk.priority !== "normal" ? `<span>❗ ${esc(t("pr." + tk.priority) || tk.priority)}</span>` : ""}
    </div>
    ${refStrip("task", tk.id, tk.refs_count || 0, tk.ref_thumbs)}
    ${next
      ? `<button class="act" data-task-to="${next.to}" data-task-id="${tk.id}">${next.label}</button>`
      : st === "done" ? `<div class="done-mark">${esc(t("tn.doneMark"))}</div>` : ""}
  </div>`;
}

function contentCard(c, {advance=true}={}){
  contentById[c.id] = c;
  const st = c.pipeline_status || "idea";
  const isFinal = st === "analytics";
  const when = c.publish_at ? fmtDateTime(c.publish_at)
             : c.publish_date ? fmtDate(c.publish_date) : null;
  const people = [
    c.smm_name && "SMM: " + c.smm_name,
    c.copywriter_name && "Сценарий: " + c.copywriter_name,
    c.editor_name && "Монтаж: " + c.editor_name,
    c.designer_name && "Дизайн: " + c.designer_name,
  ].filter(Boolean);
  return `
  <div class="card tappable" data-content-edit="${c.id}">
    <div class="row">
      <p class="title">${esc(c.topic || c.number || ("Контент #" + c.id))}</p>
      <span class="pill stage">${esc(PIPELINE_LABELS[st] || st)}</span>
    </div>
    <div class="meta">
      ${c.rubric ? `<span>🏷 ${esc(c.rubric)}</span>` : ""}
      ${c.platform ? `<span>${esc(PLATFORM_LABEL[c.platform] || c.platform)}</span>` : ""}
      ${c.format ? `<span>🎞 ${esc(c.format)}</span>` : ""}
      ${when ? `<span>📅 ${esc(when)}</span>` : ""}
      ${c.project_name ? `<span>📁 ${esc(c.project_name)}</span>` : ""}
      ${c.client_approved ? `<span>✅ клиент</span>` : ""}
    </div>
    ${c.hook ? `<p class="desc">${esc(c.hook)}</p>` : ""}
    ${people.length ? `<div class="meta">${people.map(p => `<span>${esc(p)}</span>`).join("")}</div>` : ""}
    ${refStrip("content", c.id, c.refs_count || 0, c.ref_thumbs)}
    ${advance && !isFinal ? `<button class="act" data-advance="${c.id}">${esc(t("content.advance"))}</button>` : ""}
    ${advance && isFinal ? `<button class="act ghost" disabled>${esc(t("content.final"))}</button>` : ""}
  </div>`;
}

    </select>
  </div>`;

  const order = _PIPE;
  const groups = {};
  items.forEach(c => { (groups[c.pipeline_status] ||= []).push(c); });
  const parts = [filter];
  if (!items.length){
    parts.push(`<div class="empty">${esc(contentProjectId ? t("empty.contentProj") : t("empty.content"))}</div>`);

  const mgr = isManager();
  return `
  <div class="proj-block">

      ? projects.map(p => `<div class="proj-item">📁 ${esc(p.name)}${p.description ? ` — <span class="hint">${esc(p.description)}</span>` : ""}</div>`).join("")
      : `<div class="hint">Нет активных проектов</div>`}

      <button class="act ghost" data-proj-add="${clientId}" style="margin-top:8px">＋ Проект</button>

function timeAgo(iso){
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "только что";
  if (s < 3600) return Math.floor(s / 60) + " мин назад";
  if (s < 86400) return Math.floor(s / 3600) + " ч назад";
  return Math.floor(s / 86400) + " дн назад";
}

}

async function renderDashboard(){
  let d;
  try {
    d = await api("/api/dashboard");
  } catch(e){
    view.innerHTML = `<div class="empty">${esc(e.message || "Обзор доступен только админам и AM")}</div>`;
    return;
  }
  const parts = [];

  parts.push(`<div class="stat-grid">
    ${statCard(d.open_tasks, "Задач открыто")}
    ${statCard(d.active_blockers, "Блокеров активных")}
    ${statCard(d.content_in_progress, "Контента в работе")}
    ${statCard(d.active_ideas, "Идей на голосовании")}
  </div>`);

  parts.push(`<div class="section-title">Загрузка команды</div>`);
  if (d.team_workload.length){
    parts.push(d.team_workload.map(w => {
      const total = w.total_this_month || 0, done = w.done_this_month || 0;
      const rate = total ? done / total : 0;
      const cls = !total ? "" : rate > 0.7 ? "bar-g" : rate > 0.4 ? "bar-y" : "bar-r";
      const pct = total ? Math.round(rate * 100) : 0;
      return `<div class="wl-row">
        <div class="wl-top"><span>${esc(w.name)}</span><span class="open">${w.open_tasks} откр.</span></div>
        <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
        <div class="wl-sub">${done}/${total} задач за месяц${total ? " · " + pct + "%" : ""}</div>
      </div>`;
    }).join(""));
  } else {
    parts.push(`<div class="empty">Нет данных</div>`);
  }

  parts.push(`<div class="section-title">Контент по этапам</div>`);
  const pb = d.pipeline_breakdown || {};
  const steps = Object.keys(pb).filter(k => pb[k] > 0);
  const totalC = steps.reduce((s,k) => s + pb[k], 0);
  if (totalC){
    const order = ["idea","approval","script","shoot","edit","review","client","revisions","done","published","analytics"];
    parts.push(`<div class="pipe-bar">${steps

/* Sheet dismiss: tap the top strip, or drag it down. No visible close button. */
function attachSheetDismiss(sheetEl, closeFn){
  const head = sheetEl.querySelector(".sheet-head") || sheetEl;
  let y0 = null, dy = 0, dragging = false;
  const reset = () => { sheetEl.style.transition = ""; sheetEl.style.transform = ""; };
  head.addEventListener("touchstart", e => {
    y0 = e.touches[0].clientY; dy = 0; dragging = true;
    sheetEl.style.transition = "none";
  }, {passive:true});
  head.addEventListener("touchmove", e => {
    if (!dragging) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    sheetEl.style.transform = "translateY(" + dy + "px)";
  }, {passive:true});
  head.addEventListener("touchend", () => {
    if (!dragging) return;
    dragging = false;
    reset();
    if (dy > 70) closeFn();          // dragged down far enough -> dismiss
    // a plain tap (dy ~ 0) is handled by the click event below
  });
  head.addEventListener("click", () => {
    if (dy > 6) { dy = 0; return; }  // this click trails a drag -> swallow it
    closeFn();
  });
}

  },
  shoots: {
    endpoint: "/api/shoots",
    fields: [
      { name:"title",     type:"text", required:true },
      { name:"shoot_at",  type:"datetime" },
      { name:"location",  type:"text" },
      { name:"client_id", type:"select", value:"", coerce:"int", dynamic:"clients", options:[["","—"]] },
      { name:"project_id", type:"select", value:"", coerce:"int", dynamic:"projects", dependsOn:"client_id", options:[["","—"]] },
      { name:"participant_ids", type:"mpick", dynamic:"members" },
      { name:"notes",     type:"textarea" },
    ],
  },
  ideas: {
    endpoint: "/api/ideas",
    fields: [
      { name:"title",       type:"text", required:true },
      { name:"description", type:"textarea" },
      { name:"format",      type:"select", value:"", optsKey:"formatOpt" },
    ],
  },
  blockers: {
    endpoint: "/api/blockers",
    fields: [
      { name:"title",       type:"text", required:true },

  clients: {

  team: {

      { name:"telegram_id", type:"number", required:true, coerce:"int" },

};

const sheet = document.getElementById("sheet");
const sheetBackdrop = document.getElementById("sheetBackdrop");
const formFields = document.getElementById("formFields");
const formErr = document.getElementById("formErr");
const formSubmit = document.getElementById("formSubmit");

function setFormError(msg){
  if (!msg){ formErr.style.display = "none"; return; }
  formErr.textContent = msg; formErr.style.display = "block";
}

function _fieldOpts(f){
  if (f.optsKey && OPTS_BY_KEY[f.optsKey]) return OPTS_BY_KEY[f.optsKey];
  return f.options || [["",""]];
}
function _baseOptions(f){
  return _fieldOpts(f).map(([v,l]) =>
    `<option value="${esc(v)}"${v === (f.value ?? "") ? " selected" : ""}>${esc(l)}</option>`).join("");
}
function fieldLabel(f){
  const k = "field." + f.name;
  const s = t(k);
  return s === k ? (f.label || f.name) : s;
}

async function fillMpick(f){
  const box = document.getElementById("f_" + f.name);
  if (!box) return;
  box.innerHTML = `<div class="hint">Загрузка…</div>`;
  try {
    const list = await api("/api/members");
    box.innerHTML = list.length
      ? list.map(u => `<button type="button" class="mp-opt" data-id="${u.id}">${esc(u.full_name)}</button>`).join("")
      : `<div class="hint">Нет участников</div>`;
  } catch(e){
    box.innerHTML = `<div class="hint">${esc(e.message || "недоступно")}</div>`;
  }
}

async function fillDynamic(f){
  if (f.type === "mpick"){ await fillMpick(f); return; }
  const sel = document.getElementById("f_" + f.name);
  if (!sel) return;
  const keep = sel.value;
  sel.innerHTML = _baseOptions(f);
  try {
    let items = [];
    if (f.dynamic === "team"){
      items = (await api("/api/team")).map(u => [u.id, `${u.full_name} (${ROLE_LABELS[u.role] || u.role})`]);
    } else if (f.dynamic === "members"){
      items = (await api("/api/members")).map(u => [u.id, `${u.full_name}${u.role ? " · " + (ROLE_LABELS[u.role] || u.role) : ""}`]);
    } else if (f.dynamic === "clients"){
      items = (await api("/api/clients")).map(c => [c.id, c.name]);
    } else if (f.dynamic === "projects"){
      const dep = f.dependsOn ? document.getElementById("f_" + f.dependsOn) : null;
      const cid = dep && dep.value;
      sel.disabled = false;
      const q = cid ? "?client_id=" + encodeURIComponent(cid) : "";
      items = (await api("/api/projects" + q)).map(p => [p.id, p.label || p.name]);
    }
    if (!sel.isConnected) return;
    items.forEach(([v,l]) => {
      const o = document.createElement("option");
      o.value = v; o.textContent = l; sel.appendChild(o);
    });
    if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
  } catch(e){
    if (f.dynamic !== "projects"){
      sel.disabled = true;
      const lbl = sel.previousElementSibling;
      if (lbl && !/—/.test(lbl.textContent)) lbl.textContent += " — недоступно";
    }
  }
}

let editState = null;   // {formKey, title, endpoint, method, submitLabel, prefill, extraFields}
let sheetFields = [];

function openTaskEdit(t){
  editState = {
    formKey: "home",
    titleKey: "form.editTask",
    endpoint: "/api/tasks/" + t.id,
    method: "PATCH",
    extraFields: [{ name:"status", type:"select", optsKey:"status" }],
    omitFields: ["refs"],
    refsFor: { kind: "task", id: t.id },
    prefill: {
      title: t.title || "",
      description: t.description || "",
      priority: t.priority || "normal",
      deadline: t.deadline ? String(t.deadline).slice(0, 10) : "",
      assignee_ids: (t.assignees || []).map(a => a.id),
      client_id: t.client_id || "",
      project_id: t.project_id || "",
      status: t.status || "pending",
    },
  };
  openSheet();
}

function openContentEdit(c){
  editState = {
    formKey: "content",
    titleKey: "form.editContent",
    endpoint: "/api/content/" + c.id,
    method: "PATCH",
    extraFields: [{ name:"pipeline_status", type:"select", optsKey:"pipeline" }],
    omitFields: ["refs"],

    prefill: {

      format: c.format || "post",
      platform: c.platform || "",

      client_id: c.client_id || "", project_id: c.project_id || "",
      hook: c.hook || "", script: c.script || "", caption: c.caption || "",
      hashtags: c.hashtags || "",

function openShootEdit(s){
  editState = {
    formKey: "shoots",
    titleKey: "form.editShoot",
    endpoint: "/api/shoots/" + s.id,

    extraFields: [{ name:"status", type:"select", optsKey:"shootStatus" }],

      client_id: s.client_id || "", project_id: s.project_id || "",

      notes: s.notes || "",
      status: s.status || "planned",
    },

let pendingRefs = [];   // refs collected in a create form, flushed after the item exists

function renderPendingRefs(box){
  const list = box.querySelector(".rf-list");
  list.innerHTML = pendingRefs.map((r, i) =>
    `<div class="rf-item"><span class="rf-t">${r.kind === "link" ? "🔗 " + esc(r.url) : "📎 " + esc(r.file.name)}</span><button type="button" data-rfi="${i}">✕</button></div>`).join("");
}
function commitPendingUrl(box){
  const inp = box && box.querySelector(".rf-url");
  if (!inp) return;
  let u = (inp.value || "").trim();
  if (!u) return;
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  pendingRefs.push({ kind: "link", url: u });
  inp.value = "";
  renderPendingRefs(box);
}
function wirePendingRefs(box){
  renderPendingRefs(box);
  const url = box.querySelector(".rf-url");
  url.addEventListener("keydown", e => {
    if (e.key === "Enter"){ e.preventDefault(); commitPendingUrl(box); haptic(); }
  });
  url.addEventListener("blur", () => commitPendingUrl(box));
  box.querySelector(".rf-add-file").addEventListener("click", () => box.querySelector(".rf-file").click());
  box.querySelector(".rf-file").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 20 * 1024 * 1024){ toast(t("toast.fileTooBig")); return; }
    pendingRefs.push({ kind: "file", file: f });
    haptic(); renderPendingRefs(box);
  });
  box.querySelector(".rf-list").addEventListener("click", e => {
    const b = e.target.closest("[data-rfi]");
    if (b){ pendingRefs.splice(+b.dataset.rfi, 1); renderPendingRefs(box); }
  });
}
async function flushPendingRefs(scopeKey, id){
  for (const r of pendingRefs){
    try {
      if (r.kind === "link"){
        await api("/api/references", { method:"POST", body:{ [scopeKey]: id, url: r.url } });
      } else {
        const fd = new FormData();
        fd.append("file", r.file);
        fd.append(scopeKey, String(id));
        await fetch("/api/references/upload", {
          method:"POST",
          headers:{ "X-Init-Data": INIT_DATA, "X-Telegram-Init-Data": INIT_DATA },
          body: fd,
        });
      }
    } catch(err){ /* best-effort */ }
  }
  pendingRefs = [];
}

function applyPrefill(pf){
  for (const f of sheetFields){
    if (!(f.name in pf)) continue;
    const el = document.getElementById("f_" + f.name);
    if (!el) continue;
    if (f.type === "mpick"){
      const want = new Set((pf[f.name] || []).map(String));
      el.querySelectorAll(".mp-opt").forEach(b => b.classList.toggle("on", want.has(b.dataset.id)));
    } else if (f.type === "select"){
      const v = String(pf[f.name] ?? "");
      if ([...el.options].some(o => o.value === v)) el.value = v;
    } else {
      el.value = pf[f.name] ?? "";
    }
  }
}

async function openSheet(){
  const cfg = FORMS[editState ? editState.formKey : activeFormKey()];
  if (!cfg) return;
  {
    let base = cfg.fields;
    if (editState && editState.omitFields)
      base = base.filter(f => !editState.omitFields.includes(f.name));
    sheetFields = editState && editState.extraFields
      ? base.concat(editState.extraFields) : base;
  }
  document.getElementById("sheetTitle").textContent = editState
    ? t(editState.titleKey || "form.editTask")
    : t(FORM_TITLE_KEY[activeFormKey()] || "btn.create");
  setFormError("");
  formFields.innerHTML = sheetFields.map(f => {
    const id = "f_" + f.name;
    let control;
    if (f.type === "textarea"){
      control = `<textarea id="${id}"></textarea>`;
    } else if (f.type === "select"){
      control = `<select id="${id}">${_baseOptions(f)}</select>`;
    } else if (f.type === "mpick"){
      control = `<div class="mpick" id="${id}"></div>`;
    } else if (f.type === "refs"){
      control = `<div class="refs-field" id="${id}">
        <div class="rf-list"></div>
        <input type="url" class="rf-url" placeholder="https://…  (${esc(t("refsheet.addLink"))})">
        <div class="rf-actions">
          <button type="button" class="act ghost rf-add-file">${esc(t("btn.attachFile"))}</button>
        </div>
        <input type="file" class="rf-file" hidden accept="image/*,video/*,application/pdf">
      </div>`;
    } else {
      const it = f.type === "number" ? "number"
              : f.type === "date" ? "date"
              : f.type === "datetime" ? "datetime-local" : "text";
      control = `<input id="${id}" type="${it}"${f.type === "number" ? ' inputmode="numeric"' : ""}>`;
    }
    return `<div class="field" data-field="${f.name}">
      <label for="${id}">${esc(fieldLabel(f))}${f.required ? " *" : ""}</label>${control}
    </div>`;
  }).join("");
  if (editState && editState.refsFor){
    const r = editState.refsFor;
    formFields.insertAdjacentHTML("beforeend",
      `<button type="button" class="act ghost" id="editRefsBtn" style="margin-top:4px">${esc(t("btn.refs"))}</button>`);
    document.getElementById("editRefsBtn").addEventListener("click", () => openRefSheet(r.kind, r.id));
  }
  pendingRefs = [];
  const rfBox = formFields.querySelector(".refs-field");
  if (rfBox) wirePendingRefs(rfBox);
  formSubmit.disabled = false;
  formSubmit.textContent = editState ? t("btn.save") : t("btn.create");
  sheetBackdrop.classList.add("open");
  sheet.classList.add("open");
  sheetBackOn(closeSheet);

  for (const f of sheetFields){
    if (!f.dependsOn) continue;
    const dep = document.getElementById("f_" + f.dependsOn);
    if (dep) dep.addEventListener("change", () => fillDynamic(f));
  }
  for (const f of sheetFields){
    if (f.dynamic) await fillDynamic(f);
  }
  if (editState){
    applyPrefill(editState.prefill);
    // refill dependent selects now that their parent has a value, then re-apply
    for (const f of sheetFields){
      if (f.dependsOn && f.dynamic) await fillDynamic(f);
    }
    applyPrefill(editState.prefill);
  }
}

function closeSheet(){
  sheet.classList.remove("open");
  sheetBackdrop.classList.remove("open");
  editState = null;
  pendingRefs = [];
  sheetBackOff();
}

async function submitForm(){
  if (busy || !sheetFields.length) return;
  const isEdit = !!editState;
  const method = isEdit ? editState.method : "POST";
  const endpoint = isEdit ? editState.endpoint : FORMS[activeFormKey()].endpoint;
  const body = {};
  let valid = true;
  formFields.querySelectorAll(".field").forEach(w => w.classList.remove("bad"));
  for (const f of sheetFields){
    if (f.type === "refs") continue;
    const el = document.getElementById("f_" + f.name);
    if (f.type === "mpick"){
      body[f.name] = [...el.querySelectorAll(".mp-opt.on")].map(b => +b.dataset.id);
      if (!isEdit && !body[f.name].length) delete body[f.name];
      continue;
    }
    const raw = (el.value || "").trim();
    if (f.required && !raw){
      el.closest(".field").classList.add("bad"); valid = false; continue;
    }
    if (raw === "" && !isEdit) continue;   // on edit, send blanks to clear
    if (f.type === "number" || f.coerce === "int"){
      const n = parseInt(raw, 10);
      body[f.name] = Number.isNaN(n) ? null : n;
    } else {
      body[f.name] = raw;
    }
  }
  if (!valid){ setFormError(t("toast.fillRequired")); return; }
  if (!isEdit) commitPendingUrl(formFields.querySelector(".refs-field"));

  busy = true;
  formSubmit.disabled = true; formSubmit.textContent = t("btn.saving");
  setFormError("");
  const wasEdit = isEdit;
  const formKey = activeFormKey();
  try {
    const saved = await api(endpoint, { method, body });
    if (!wasEdit && pendingRefs.length && saved && saved.id){
      formSubmit.textContent = t("btn.uploadingRefs");
      await flushPendingRefs(formKey === "content" ? "content_id" : "task_id", saved.id);
    }
    haptic("medium");
    closeSheet();
    toast(wasEdit ? t("toast.saved") : t("toast.created"));
    await load(currentTab);
  } catch(e){
    setFormError(e.message || t("err.save"));
    formSubmit.disabled = false;
    formSubmit.textContent = wasEdit ? t("btn.save") : t("btn.create");
  } finally {
    busy = false;
  }
}

document.getElementById("fab").addEventListener("click", () => { haptic(); openSheet(); });
sheetBackdrop.addEventListener("click", closeSheet);
attachSheetDismiss(sheet, closeSheet);
formSubmit.addEventListener("click", submitForm);
formFields.addEventListener("click", e => {
  const opt = e.target.closest(".mp-opt");
  if (opt){ opt.classList.toggle("on"); haptic(); }
});

/* ── pull-to-refresh (like YouTube) ─────────────────────── */
(function pullToRefresh(){
  const ptr = document.getElementById("ptr");
  const MAX = 72, TRIGGER = 56;
  let y0 = 0, active = false, dist = 0;

  view.addEventListener("touchstart", (e) => {
    if (view.scrollTop <= 0 && !busy && e.touches.length === 1){
      y0 = e.touches[0].clientY; active = true; dist = 0;
      ptr.classList.remove("anim");
    }
  }, {passive:true});

  view.addEventListener("touchmove", (e) => {
    if (!active) return;
    dist = e.touches[0].clientY - y0;
    if (dist <= 0){ ptr.style.height = "0px"; return; }
    const h = Math.min(dist * 0.5, MAX);
    ptr.style.height = h + "px";
    ptr.querySelector("span").style.opacity = Math.min(h / TRIGGER, 1);
  }, {passive:true});

  async function end(){
    if (!active) return;
    active = false;
    ptr.classList.add("anim");
    if (dist * 0.5 >= TRIGGER){
      ptr.style.height = "40px";
      ptr.classList.add("spin");
      haptic("light");
      try { await load(currentTab); } finally {
        ptr.classList.remove("spin");
        ptr.style.height = "0px";
      }
    } else {
      ptr.style.height = "0px";
    }
    dist = 0;
  }
  view.addEventListener("touchend", end, {passive:true});
  view.addEventListener("touchcancel", end, {passive:true});
})();

applyI18n();
load("home");
