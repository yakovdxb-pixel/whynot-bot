<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WHY NOT? OS</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1a0820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WHY NOT? OS">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    /* WHY NOT? brand — fixed dark plum theme */
    --bg:#1a0820;
    --card:#2c1636;
    --text:#f4eff7;
    --hint:#a290ae;
    --link:#25dcac;
    --btn:#1ec89a;
    --btn-text:#04231b;
    --sep:rgba(255,255,255,.10);
    --st-pending:#8f8f96;
    --st-in_progress:#4aa3ff;
    --st-done:#2ecb6a;
    --st-overdue:#ff5147;
    --st-cancelled:#8f8f96;
    --fab:#1ec89a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0; padding:0;
    background:var(--bg); color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    overflow:hidden; overscroll-behavior:none;
  }
  /* --- title bar: a normal thin row; in fullscreen it floats between
         Telegram's Close pill and the ⋯ menu, reclaiming the whole row --- */
  #fsSpacer{flex:0 0 auto; height:0}
  html.fs #fsSpacer{height:calc(var(--sa-top, 0px) + var(--csa-top, 0px))}

  #brandbar{
    flex:0 0 auto; background:var(--bg);
    padding:6px calc(16px + var(--safe-right, 0px)) 7px calc(16px + var(--safe-left, 0px));
    border-bottom:1px solid var(--sep);
    font-size:13px; color:var(--hint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #brandbar b{color:var(--text); font-weight:700; font-size:15px}
  #whoami:not(:empty)::before{content:" · "; color:var(--hint)}

  html.fs #brandbar{
    position:fixed; left:50%; transform:translateX(-50%);
    top:calc(var(--sa-top, 0px) + 1px);
    padding:0; border:none; background:transparent; z-index:40;
    max-width:60vw; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; line-height:1.15;
  }
  html.fs #brandbar b{font-size:13px}
  html.fs #whoami{font-size:10px; color:var(--hint); text-transform:lowercase}
  html.fs #whoami::before{content:none}

  #ptr{
    flex:0 0 auto; height:0; overflow:hidden;
    display:flex; align-items:flex-end; justify-content:center;
    color:var(--hint); font-size:18px;
  }
  #ptr.anim{transition:height .2s}
  #ptr.spin span{display:inline-block; animation:ptrspin .8s linear infinite}
  @keyframes ptrspin{to{transform:rotate(360deg)}}

  .no-access{text-align:center; padding:60px 24px}
  .no-access .na-emoji{font-size:44px}
  .no-access .na-title{font-size:19px; font-weight:700; margin:14px 0 6px}
  .no-access .na-sub{color:var(--hint); font-size:14px; margin:0 0 16px}
  .no-access .na-id{
    font-size:22px; font-weight:800; letter-spacing:.5px;
    background:var(--card); color:var(--text); border:1px solid var(--sep);
    border-radius:12px; padding:12px 22px; cursor:pointer;
  }
  .no-access .na-hint{color:var(--hint); font-size:12px; margin-top:8px}

  main#view{
    flex:1 1 auto; min-height:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    padding:14px 16px calc(96px + env(safe-area-inset-bottom));
  }
  .section-title{font-size:13px; font-weight:600; color:var(--hint);
    text-transform:uppercase; letter-spacing:.04em; margin:18px 2px 8px}
  .section-title:first-child{margin-top:4px}

  .card{
    background:var(--card); border:1px solid rgba(255,255,255,.05); border-radius:14px;
    padding:13px 14px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,.35);
  }
  .card .row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .card .title{font-weight:600; font-size:15px; margin:0}
  .card .desc{color:var(--hint); font-size:13px; margin:5px 0 0; white-space:pre-wrap}
  .card .meta{color:var(--hint); font-size:12px; margin-top:7px; display:flex; gap:10px; flex-wrap:wrap}

  .pill{
    display:inline-block; font-size:11px; font-weight:600; padding:3px 9px;
    border-radius:999px; color:#fff; white-space:nowrap; text-transform:lowercase;
  }
  .pill.pending{background:var(--st-pending)}
  .pill.in_progress{background:var(--st-in_progress)}
  .pill.done{background:var(--st-done)}
  .pill.overdue{background:var(--st-overdue)}
  .pill.cancelled{background:var(--st-cancelled)}
  .pill.stage{background:var(--link)}

  button.act{
    margin-top:11px; width:100%; border:none; border-radius:10px;
    background:var(--btn); color:var(--btn-text);
    font-size:14px; font-weight:600; padding:10px; cursor:pointer;
  }
  button.act:active{opacity:.7}
  button.act.ghost{background:transparent; color:var(--link); border:1px solid var(--sep)}
  button.act[disabled]{opacity:.45; cursor:default}

  .seg{
    display:flex; background:var(--card); border-radius:10px; padding:3px;
    margin:2px 0 12px;
  }
  .seg button{
    flex:1; border:none; background:none; color:var(--hint); cursor:pointer;
    font-size:13px; font-weight:600; padding:7px 0; border-radius:8px;
  }
  .seg{background:rgba(0,0,0,.28)}
  .seg button.on{background:var(--card); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.4)}

  .done-mark{margin-top:10px; text-align:center; color:var(--st-done); font-weight:600; font-size:14px}

  .pills-row{
    display:flex; gap:6px; overflow-x:auto; margin:2px 0 12px; padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
  }
  .pills-row::-webkit-scrollbar{display:none}
  .pill-btn{
    flex:0 0 auto; border:1px solid var(--sep); background:transparent; color:var(--hint);
    border-radius:999px; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .pill-btn.on{background:var(--btn); color:var(--btn-text); border-color:transparent}

  .client-card .row{cursor:pointer}
  .proj-block{margin-top:12px; border-top:1px solid var(--sep); padding-top:10px}
  .proj-item{font-size:14px; padding:5px 0}
  .proj-item .hint{color:var(--hint)}
  .proj-form{margin-top:8px; display:flex; flex-direction:column; gap:8px}
  .proj-form input, .proj-form textarea{
    width:100%; font:14px inherit; color:var(--text); background:var(--bg);
    border:1px solid var(--sep); border-radius:9px; padding:8px 10px; outline:none;
  }
  .proj-form textarea{min-height:52px; resize:vertical}

  .vote{
    display:flex; align-items:center; gap:6px; border:1px solid var(--sep);
    background:transparent; color:var(--text); border-radius:999px;
    padding:6px 12px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .vote.on{background:var(--btn); color:var(--btn-text); border-color:transparent}

  .empty{color:var(--hint); text-align:center; padding:34px 10px; font-size:14px}
  .loader{color:var(--hint); text-align:center; padding:34px 10px}
  .err{
    background:color-mix(in srgb, var(--st-overdue) 14%, transparent);
    color:var(--st-overdue); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:10px;
  }

  nav{
    flex:0 0 auto; z-index:10;
    display:flex; background:var(--bg); border-top:1px solid var(--sep);
    padding-bottom:calc(var(--safe-bottom, 0px) + env(safe-area-inset-bottom));
  }
  nav button{
    flex:1 1 0; min-width:0; background:none; border:none; cursor:pointer;
    padding:7px 2px 6px; color:var(--hint); font-size:10px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav button span:last-child{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  nav button .ic{font-size:20px; line-height:1}
  nav button.active{color:var(--link)}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px}
  .stat{background:var(--card); border-radius:14px; padding:13px 14px; box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .stat .n{font-size:26px; font-weight:800; line-height:1.1}
  .stat .l{font-size:12px; color:var(--hint); margin-top:4px}

  .wl-row{background:var(--card); border-radius:12px; padding:11px 13px; margin-bottom:8px}
  .wl-top{display:flex; justify-content:space-between; align-items:baseline; font-size:14px}
  .wl-top .open{color:var(--hint); font-size:12px}
  .bar{height:7px; border-radius:4px; background:var(--sep); margin-top:8px; overflow:hidden}
  .bar > i{display:block; height:100%; border-radius:4px}
  .bar-g{background:var(--st-done)} .bar-y{background:#ffcc00} .bar-r{background:var(--st-overdue)}
  .wl-sub{font-size:11px; color:var(--hint); margin-top:5px}

  .pipe-bar{display:flex; height:26px; border-radius:8px; overflow:hidden; margin:4px 0 8px}
  .pipe-seg{display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; min-width:22px}
  .pipe-legend{display:flex; flex-wrap:wrap; gap:8px 14px; font-size:11px; color:var(--hint)}
  .pipe-legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:middle}

  .act-row{font-size:13px; padding:8px 0; border-bottom:1px solid var(--sep)}
  .act-row:last-child{border-bottom:none}
  .act-row .ago{color:var(--hint); font-size:11px; margin-left:4px}

  .card.tappable{cursor:pointer}
  .card.tappable:active{opacity:.75}
  #memberSheet select, #memberSheet input{
    width:100%; font:15px inherit; color:var(--text);
    background:var(--card); border:1px solid var(--sep); border-radius:10px;
    padding:10px 12px; outline:none; -webkit-appearance:none; appearance:none;
  }
  #memberSheet input:focus, #memberSheet select:focus{border-color:var(--link)}
  #memberSheet #memberDelete{color:var(--st-overdue); border-color:color-mix(in srgb, var(--st-overdue) 45%, transparent)}
  #memberSheet #memberDelete[hidden]{display:none}

  #installBanner{
    display:flex; align-items:center; gap:10px;
    background:#6c5ce7; color:#fff;
    padding:10px 12px; font-size:13px; line-height:1.35;
  }
  #installBanner[hidden]{display:none}
  #installBanner #installText{flex:1}
  #installBanner #installBtn{
    flex:0 0 auto; border:none; border-radius:8px; cursor:pointer;
    background:#fff; color:#6c5ce7; font-size:13px; font-weight:700; padding:8px 12px;
  }
  #installBanner #installBtn[hidden]{display:none}
  #installBanner #installClose{
    flex:0 0 auto; border:none; background:transparent; color:#fff;
    font-size:20px; line-height:1; cursor:pointer; padding:0 2px;
  }

  .toast{
    position:fixed; left:50%; bottom:calc(78px + var(--safe-bottom, 0px)); transform:translateX(-50%);
    background:#000; color:#fff; padding:9px 16px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20;
    max-width:88%;
  }
  .toast.show{opacity:.92}

  /* ── floating + button ─────────────────────────────────── */
  .fab{
    position:fixed; right:16px; z-index:15;
    bottom:calc(64px + 14px + var(--safe-bottom, 0px) + env(safe-area-inset-bottom));
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:var(--fab, #ff6b5e); color:#fff; font-size:28px; line-height:52px;
    box-shadow:0 4px 14px rgba(0,0,0,.28); padding:0;
    transition:transform .12s;
  }
  .fab:active{transform:scale(.9)}

  /* ── bottom-sheet modal ────────────────────────────────── */
  .sheet-backdrop{
    position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:31;
    background:var(--bg); color:var(--text);
    border-radius:16px 16px 0 0; padding:8px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .26s cubic-bezier(.32,.72,0,1);
    max-height:88vh; overflow-y:auto;
  }
  .sheet.open{transform:translateY(0)}
  .sheet .grabber{width:36px; height:4px; border-radius:2px; background:var(--sep);
    margin:6px auto 12px}
  .sheet h2{font-size:17px; font-weight:700; margin:0 0 14px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12px; color:var(--hint); margin-bottom:5px}
  .field input, .field textarea, .field select{
    width:100%; font:15px inherit; color:var(--text);
    background:var(--card); border:1px solid var(--sep); border-radius:10px;
    padding:10px 12px; outline:none; -webkit-appearance:none; appearance:none;
  }
  .field textarea{min-height:74px; resize:vertical}
  .field select{background-image:none}
  .field input::placeholder, .field textarea::placeholder,
  .proj-form input::placeholder, .proj-form textarea::placeholder{color:var(--hint)}
  .field select option{background:var(--card); color:var(--text)}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--link)}
  .field.bad input, .field.bad textarea, .field.bad select{border-color:var(--st-overdue)}
  .sheet .form-err{
    background:color-mix(in srgb, var(--st-overdue) 14%, transparent);
    color:var(--st-overdue); border-radius:10px; padding:9px 12px; font-size:13px; margin-bottom:10px;
  }
  .sheet .submit{
    width:100%; border:none; border-radius:12px; margin-top:4px;
    background:var(--btn); color:var(--btn-text); font-size:15px; font-weight:600;
    padding:13px; cursor:pointer;
  }
  .sheet .submit[disabled]{opacity:.55; cursor:default}
</style>
</head>
<body>
<div id="fsSpacer"></div>
<div id="brandbar">
  <span id="screenTitle" hidden></span>
  <b id="screenLabel">Главная</b><span id="whoami"></span>
</div>

<div id="installBanner" hidden>
  <span id="installText"></span>
  <button id="installBtn" hidden>📲 Установить приложение</button>
  <button id="installClose" aria-label="Закрыть">×</button>
</div>

<div id="ptr"><span>⟳</span></div>
<main id="view"><div class="loader">Загрузка…</div></main>

<nav>
  <button data-tab="home" class="active"><span class="ic">🏠</span><span>Главная</span></button>
  <button data-tab="content"><span class="ic">📋</span><span>Контент</span></button>
  <button data-tab="ideas"><span class="ic">💡</span><span>Идеи</span></button>
  <button data-tab="blockers"><span class="ic">🚫</span><span>Блокеры</span></button>
  <button data-tab="team"><span class="ic">👥</span><span>Команда</span></button>

</nav>

  <div class="grabber"></div>

  <div class="field"><label>Роль</label><select id="memberRole"></select></div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const INIT_DATA = (tg && tg.initData) || "";

/* make the Mini App feel solid inside Telegram */
(function tgChrome(){
  if (!tg) return;
  const atLeast = (v) => !tg.isVersionAtLeast || tg.isVersionAtLeast(v);
  try { tg.ready(); } catch(e){}
  try { tg.expand(); } catch(e){}
  // stop the swipe-down gesture that collapses / drags the app (Bot API 7.7+)
  try { if (atLeast("7.7") && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch(e){}
  // paint Telegram's top bar in the brand colour so it blends in
  try { if (tg.setHeaderColor) tg.setHeaderColor("#1a0820"); } catch(e){}
  try { if (tg.setBackgroundColor) tg.setBackgroundColor("#1a0820"); } catch(e){}

  // keep content clear of the notch + Telegram's floating controls
  const rootEl = document.documentElement;
  const root = rootEl.style;
  function applyInsets(){
    const s = tg.safeAreaInset || {};
    const c = tg.contentSafeAreaInset || {};
    const px = (n) => (n && n > 0 ? n + "px" : "0px");
    root.setProperty("--sa-top",       px(s.top || 0));                 // notch only
    root.setProperty("--csa-top",      px(c.top || 0));                 // Telegram controls
    root.setProperty("--safe-top",     px((s.top || 0) + (c.top || 0)));
    root.setProperty("--safe-bottom",  px((s.bottom || 0) + (c.bottom || 0)));
    root.setProperty("--safe-left",    px((s.left || 0) + (c.left || 0)));
    root.setProperty("--safe-right",   px((s.right || 0) + (c.right || 0)));
    rootEl.classList.toggle("fs", !!tg.isFullscreen);
  }
  ["safeAreaChanged", "contentSafeAreaChanged", "fullscreenChanged"].forEach((ev) => {
    try { tg.onEvent && tg.onEvent(ev, applyInsets); } catch(e){}
  });

  // open edge-to-edge for maximum working area (Bot API 8.0+)
  try {
    if (atLeast("8.0") && tg.requestFullscreen && !tg.isFullscreen){
      tg.requestFullscreen();
    }
  } catch(e){}
  applyInsets();
})();

/* ── install / add-to-home-screen banner ────────────────── */
(function installBanner(){
  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;
  const inTelegram = !!(tg && tg.initData);
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

  const bar   = document.getElementById("installBanner");
  const txt   = document.getElementById("installText");
  const btn   = document.getElementById("installBtn");
  const close = document.getElementById("installClose");
  let deferred = null;

  function dismissed(){ try { return localStorage.getItem("wn_install_dismissed") === "1"; } catch(e){ return false; } }
  function hide(){ bar.hidden = true; }
  function show(){ if (!isStandalone && !dismissed()) bar.hidden = false; }

  close.addEventListener("click", () => {
    try { localStorage.setItem("wn_install_dismissed", "1"); } catch(e){}
    hide();
  });

  if (isStandalone) return;

  // ── inside Telegram → use the native "Add to Home Screen" (Bot API 8.0+) ──
  if (inTelegram){
    const canAdd = tg && typeof tg.addToHomeScreen === "function" &&
                   (!tg.isVersionAtLeast || tg.isVersionAtLeast("8.0"));
    if (!canAdd) return;

    const offer = () => {
      txt.textContent = "Добавить WHY NOT? OS на главный экран";
      btn.textContent = "📲 Добавить";
      btn.hidden = false;
      show();
    };
    btn.addEventListener("click", () => { btn.disabled = true; try { tg.addToHomeScreen(); } catch(e){} });
    tg.onEvent && tg.onEvent("homeScreenAdded", hide);

    if (typeof tg.checkHomeScreenStatus === "function"){
      try {
        tg.checkHomeScreenStatus((status) => {
          if (status === "added" || status === "unsupported") hide();
          else offer();
        });
      } catch(e){ offer(); }
    } else {
      offer();
    }
    return;
  }

  // ── plain browser → PWA install ──
  if (isIOS){
    txt.innerHTML = 'Установи как приложение: <b>Поделиться</b> ⬆️ → <b>На экран «Домой»</b>';
    btn.hidden = true;
    show();
  }

  window.addEventListener("beforeinstallprompt", (e) => {   // Android / desktop Chrome
    e.preventDefault();
    deferred = e;
    txt.textContent = "Установить WHY NOT? OS на телефон";
    btn.hidden = false;
    show();
  });

  btn.addEventListener("click", async () => {
    if (!deferred) return;
    btn.disabled = true;
    deferred.prompt();
    try { await deferred.userChoice; } catch(e){}
    deferred = null;
    hide();
  });

  window.addEventListener("appinstalled", () => {
    try { localStorage.setItem("wn_install_dismissed", "1"); } catch(e){}
    hide();
  });
})();

const TITLES = { home:"Главная", content:"Контент", ideas:"Идеи", blockers:"Блокеры", team:"Команда", dash:"Обзор" };
const ENTITY_NOUN = { task:"задачу", content:"контент", idea:"идею", blocker:"блокер", project:"проект", client:"клиента", user:"пользователя" };
const ACTION_VERB = { created:"создал", updated:"обновил", completed:"завершил", moved:"продвинул", voted:"проголосовал за", vote_changed:"переголосовал за", assigned:"назначил", resolved:"закрыл" };
const ROLE_LABELS = {
  admin:"Админ", am:"AM", producer:"Продюсер", smm:"SMM", photographer:"Фотограф",
  editor:"Монтажёр", designer:"Дизайнер", copywriter:"Копирайтер", intern:"Стажёр"
};
const ROLE_COLORS = {
  admin:"#8e44ad", am:"#2481cc", smm:"#34c759", designer:"#ff9500",
  photographer:"#ffcc00", editor:"#1abc9c", intern:"#8a8a8e"
};
const PIPELINE_LABELS = {
  idea:"Идея", approval:"Согласование", script:"Сценарий", shoot:"Съёмка",
  edit:"Монтаж", review:"Ревью", client:"У клиента", revisions:"Правки",
  done:"Готово", published:"Опубликовано", analytics:"Аналитика"
};
const STATUS_LABELS = {
  pending:"ожидает", in_progress:"в работе", done:"готово",
  overdue:"просрочено", cancelled:"отменено"
};
// which status button a task card shows, keyed by current status
const TASK_NEXT = {
  pending:     { to:"in_progress", label:"▶ В работу" },
  overdue:     { to:"in_progress", label:"▶ В работу" },
  in_progress: { to:"done",        label:"✅ Готово" },
};

const view = document.getElementById("view");
const screenTitle = document.getElementById("screenTitle");
let currentTab = "home";
let homeScope = "mine";   // "mine" | "all" — Главная tasks filter
let teamSub = "team";     // "team" | "clients" — Команда sub-section
let contentClientId = ""; // "" = all — Контент client filter
let expandedClient = null;
let clientProjects = {};  // clientId -> projects array | null(loading)
let ME = null;            // current user {id, role, full_name, registered, ...}
let busy = false;

function isManager(){ return !!(ME && (ME.role === "admin" || ME.role === "am")); }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}
function haptic(kind){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind||"light"); }catch(e){} }

async function api(path, opts){
  opts = opts || {};
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: {
      "Content-Type": "application/json",
      "X-Init-Data": INIT_DATA,
      "X-Telegram-Init-Data": INIT_DATA,
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok){
    const d = data && data.detail;
    const msg = (d && (typeof d === "string" ? d : d.message)) || (data && data.message) || ("Ошибка " + res.status);
    const err = new Error(msg);
    err.status = res.status;
    err.detail = d;
    throw err;
  }
  return data;
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]
));
function fmtDate(v){
  if(!v) return null;
  const d = new Date(v);
  if(isNaN(d)) return String(v);
  return d.toLocaleDateString("ru-RU", {day:"2-digit", month:"short"});
}
function deadlineMeta(v){
  const f = fmtDate(v);
  return f ? `⏰ ${f}` : "⏰ без срока";
}

function taskCard(t){
  const st = t.status || "pending";
  const next = TASK_NEXT[st];
  return `
  <div class="card" data-task="${t.id}">
    <div class="row">
      <p class="title">${esc(t.title || "Без названия")}</p>
      <span class="pill ${esc(st)}">${esc(STATUS_LABELS[st] || st)}</span>
    </div>
    ${t.description ? `<p class="desc">${esc(t.description)}</p>` : ""}
    <div class="meta">
      <span>${deadlineMeta(t.deadline)}</span>
      ${t.assignee_name ? `<span>👤 ${esc(t.assignee_name)}</span>` : ""}
      ${t.priority && t.priority !== "normal" ? `<span>❗ ${esc(t.priority)}</span>` : ""}
    </div>
    ${next
      ? `<button class="act" data-task-to="${next.to}" data-task-id="${t.id}">${next.label}</button>`
      : st === "done" ? `<div class="done-mark">✅ Выполнено</div>` : ""}
  </div>`;
}

function blockerCard(b){
  return `
  <div class="card">
    <div class="row">
      <p class="title">🚫 ${esc(b.title || "Блокер")}</p>
    </div>
    ${b.description ? `<p class="desc">${esc(b.description)}</p>` : ""}
    <div class="meta">
      ${b.reported_by_name ? `<span>сообщил: ${esc(b.reported_by_name)}</span>` : ""}
      ${b.assigned_to_name ? `<span>на: ${esc(b.assigned_to_name)}</span>` : ""}
      ${b.created_at ? `<span>${esc(fmtDate(b.created_at))}</span>` : ""}
    </div>
  </div>`;
}

/* ── screens ─────────────────────────────────────────────── */

async function renderHome(){
  const [d, tasks] = await Promise.all([
    api("/api/home"),
    api("/api/tasks?my=" + (homeScope === "mine" ? "true" : "false")),
  ]);
  ME = d.user;
  setWhoami(d.user);
  const parts = [];

  parts.push(`
    <div class="seg" id="scopeSeg">
      <button data-scope="mine" class="${homeScope === "mine" ? "on" : ""}">Мои</button>
      <button data-scope="all"  class="${homeScope === "all"  ? "on" : ""}">Все</button>
    </div>`);

  parts.push(`<div class="section-title">Задачи</div>`);
  parts.push(tasks.length
    ? tasks.map(taskCard).join("")
    : `<div class="empty">${homeScope === "mine" ? "Нет задач 🎉" : "Задач нет"}</div>`);

  parts.push(`<div class="section-title">Мои блокеры</div>`);
  parts.push(d.my_blockers.length
    ? d.my_blockers.map(blockerCard).join("")
    : `<div class="empty">Блокеров нет</div>`);

  if (d.my_content && d.my_content.length){
    parts.push(`<div class="section-title">Мой контент</div>`);
    parts.push(d.my_content.map(c => contentCard(c, {advance:false})).join(""));
  }
  view.innerHTML = parts.join("");
}

function contentCard(c, {advance=true}={}){
  const st = c.pipeline_status || "idea";
  const isFinal = st === "analytics";
  return `
  <div class="card" data-content="${c.id}">
    <div class="row">
      <p class="title">${esc(c.topic || c.number || ("Контент #" + c.id))}</p>
      <span class="pill stage">${esc(PIPELINE_LABELS[st] || st)}</span>
    </div>
    ${c.description ? `<p class="desc">${esc(c.description)}</p>` : ""}
    <div class="meta">
      ${c.format ? `<span>🎞 ${esc(c.format)}</span>` : ""}
      ${c.publish_date ? `<span>📅 ${esc(fmtDate(c.publish_date))}</span>` : ""}
      ${c.client_approved ? `<span>✅ клиент</span>` : ""}
    </div>
    ${advance && !isFinal ? `<button class="act" data-advance="${c.id}">Продвинуть →</button>` : ""}
    ${advance && isFinal ? `<button class="act ghost" disabled>Финальный этап</button>` : ""}
  </div>`;
}

async function renderContent(){
  const [clients, items] = await Promise.all([
    api("/api/clients").catch(() => []),
    api("/api/content" + (contentClientId ? "?client_id=" + encodeURIComponent(contentClientId) : "")),
  ]);
  const pills = `<div class="pills-row">
    <button class="pill-btn ${contentClientId === "" ? "on" : ""}" data-cfilter="">Все</button>
    ${clients.map(c => `<button class="pill-btn ${String(contentClientId) === String(c.id) ? "on" : ""}" data-cfilter="${c.id}">${esc(c.name)}</button>`).join("")}
  </div>`;

  const order = ["idea","approval","script","shoot","edit","review","client","revisions","done","published","analytics"];
  const groups = {};
  items.forEach(c => { (groups[c.pipeline_status] ||= []).push(c); });
  const parts = [pills];
  if (!items.length){
    parts.push(`<div class="empty">${contentClientId ? "У клиента нет контента" : "Контента пока нет"}</div>`);
  } else {
    order.forEach(st => {
      if (!groups[st]) return;
      parts.push(`<div class="section-title">${PIPELINE_LABELS[st] || st} · ${groups[st].length}</div>`);
      parts.push(groups[st].map(c => contentCard(c)).join(""));
    });
  }
  view.innerHTML = parts.join("");
}

async function renderIdeas(){
  const ideas = await api("/api/ideas");
  if (!ideas.length){ view.innerHTML = `<div class="empty">Идей пока нет — предложи первую в боте</div>`; return; }
  view.innerHTML = ideas.map(i => `
    <div class="card">
      <div class="row">
        <p class="title">💡 ${esc(i.title || "Идея")}</p>
        <button class="vote ${i.voted ? "on":""}" data-vote="${i.id}">👍 <span>${i.votes_count||0}</span></button>
      </div>
      ${i.description ? `<p class="desc">${esc(i.description)}</p>` : ""}
      <div class="meta">
        ${i.format ? `<span>🎞 ${esc(i.format)}</span>` : ""}
        ${i.proposed_by_name ? `<span>от ${esc(i.proposed_by_name)}</span>` : ""}
        ${i.status ? `<span>${esc(i.status)}</span>` : ""}
      </div>
    </div>`).join("");
}

async function renderBlockers(){
  const list = await api("/api/blockers");
  view.innerHTML = list.length
    ? list.map(blockerCard).join("")
    : `<div class="empty">Активных блокеров нет 👌</div>`;
}

let teamById = {};

function teamCard(u, canManage){
  const label = ROLE_LABELS[u.role] || u.role;
  const color = ROLE_COLORS[u.role] || "#8a8a8e";
  teamById[u.id] = u;
  return `
  <div class="card${canManage ? " tappable" : ""}"${canManage ? ` data-member="${u.id}"` : ""}>
    <div class="row">
      <p class="title">${esc(u.full_name || "—")}</p>
      <span class="pill" style="background:${color}">${esc(label)}</span>
    </div>
    <div class="meta">
      ${u.username ? `<span>@${esc(u.username)}</span>` : ""}
      ${u.telegram_id ? `<span>ID ${esc(String(u.telegram_id))}</span>` : ""}
      ${canManage ? `<span>изменить ›</span>` : ""}
    </div>
  </div>`;
}

function clientCard(c){
  const open = expandedClient === c.id;
  const active = c.is_active !== false;
  return `
  <div class="card client-card" data-client="${c.id}">
    <div class="row" data-client-toggle="${c.id}">
      <p class="title">${esc(c.name)}</p>
      <span class="pill ${active ? "done" : "cancelled"}">${active ? "активен" : "неактивен"}</span>
    </div>
    <div class="meta">
      ${c.contact ? `<span>${esc(c.contact)}</span>` : ""}
      ${c.am_name ? `<span>AM: ${esc(c.am_name)}</span>` : ""}
      <span>${open ? "▲" : "▼ проекты"}</span>
    </div>
    ${open ? projectsBlock(c.id) : ""}
  </div>`;
}

function projectsBlock(clientId){
  const projects = clientProjects[clientId];
  if (!Array.isArray(projects)){
    return `<div class="proj-block"><div class="hint">Загрузка проектов…</div></div>`;
  }
  const mgr = isManager();
  return `
  <div class="proj-block">
    ${projects.length
      ? projects.map(p => `<div class="proj-item">📁 ${esc(p.name)}${p.description ? ` — <span class="hint">${esc(p.description)}</span>` : ""}</div>`).join("")
      : `<div class="hint">Нет активных проектов</div>`}
    ${mgr ? `
      <button class="act ghost" data-proj-add="${clientId}" style="margin-top:8px">＋ Проект</button>
      <div class="proj-form" id="projForm-${clientId}" style="display:none">
        <input id="projName-${clientId}" placeholder="Название проекта *">
        <textarea id="projDesc-${clientId}" placeholder="Описание"></textarea>
        <button class="act" data-proj-save="${clientId}">Создать проект</button>
      </div>` : ""}
  </div>`;
}

async function renderTeam(){
  if (!ME){
    try { const home = await api("/api/home"); ME = home.user; setWhoami(ME); } catch(e){}
  }
  const pills = `
    <div class="seg">
      <button data-teamsub="team"    class="${teamSub === "team" ? "on" : ""}">👥 Команда</button>
      <button data-teamsub="clients" class="${teamSub === "clients" ? "on" : ""}">🏢 Клиенты</button>
    </div>`;

  let body;
  if (teamSub === "team"){
    try {
      const team = await api("/api/team");
      teamById = {};
      body = team.length
        ? team.map(u => teamCard(u, isManager())).join("")
        : `<div class="empty">В команде пока никого</div>`;
    } catch(e){
      body = `<div class="empty">${esc(e.message || "Список команды — только для админов и AM")}</div>`;
    }
  } else {
    try {
      const clients = await api("/api/clients");
      body = clients.length
        ? clients.map(clientCard).join("")
        : `<div class="empty">Клиентов пока нет</div>`;
    } catch(e){
      body = `<div class="empty">${esc(e.message || "Не удалось загрузить клиентов")}</div>`;
    }
  }
  view.innerHTML = pills + body;
  updateFab();
}

function timeAgo(iso){
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "только что";
  if (s < 3600) return Math.floor(s / 60) + " мин назад";
  if (s < 86400) return Math.floor(s / 3600) + " ч назад";
  return Math.floor(s / 86400) + " дн назад";
}

function activityLine(a){
  const who = esc(a.actor_name || "Кто-то");
  const verb = ACTION_VERB[a.action] || a.action;
  const noun = ENTITY_NOUN[a.entity] || a.entity;
  const t = a.title ? ` «${esc(a.title)}»` : "";
  return `<div class="act-row">${who} ${verb} ${noun}${t}<span class="ago">· ${esc(timeAgo(a.happened_at))}</span></div>`;
}

const PIPE_COLORS = ["#8e8e93","#5ac8fa","#5856d6","#af52de","#ff9500","#ff2d55","#34c759","#ffcc00","#30b0c7","#248a3d","#8e8e93"];

async function renderDashboard(){
  let d;
  try {
    d = await api("/api/dashboard");
  } catch(e){
    view.innerHTML = `<div class="empty">${esc(e.message || "Обзор доступен только админам и AM")}</div>`;
    return;
  }
  const parts = [];

  parts.push(`<div class="stat-grid">
    ${statCard(d.open_tasks, "Задач открыто")}
    ${statCard(d.active_blockers, "Блокеров активных")}
    ${statCard(d.content_in_progress, "Контента в работе")}
    ${statCard(d.active_ideas, "Идей на голосовании")}
  </div>`);

  parts.push(`<div class="section-title">Загрузка команды</div>`);
  if (d.team_workload.length){
    parts.push(d.team_workload.map(w => {
      const total = w.total_this_month || 0, done = w.done_this_month || 0;
      const rate = total ? done / total : 0;
      const cls = !total ? "" : rate > 0.7 ? "bar-g" : rate > 0.4 ? "bar-y" : "bar-r";
      const pct = total ? Math.round(rate * 100) : 0;
      return `<div class="wl-row">
        <div class="wl-top"><span>${esc(w.name)}</span><span class="open">${w.open_tasks} откр.</span></div>
        <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
        <div class="wl-sub">${done}/${total} задач за месяц${total ? " · " + pct + "%" : ""}</div>
      </div>`;
    }).join(""));
  } else {
    parts.push(`<div class="empty">Нет данных</div>`);
  }

  parts.push(`<div class="section-title">Контент по этапам</div>`);
  const pb = d.pipeline_breakdown || {};
  const steps = Object.keys(pb).filter(k => pb[k] > 0);
  const totalC = steps.reduce((s,k) => s + pb[k], 0);
  if (totalC){
    const order = ["idea","approval","script","shoot","edit","review","client","revisions","done","published","analytics"];
    parts.push(`<div class="pipe-bar">${steps
      .sort((a,b) => order.indexOf(a) - order.indexOf(b))
      .map(k => `<div class="pipe-seg" style="flex:${pb[k]};background:${PIPE_COLORS[order.indexOf(k)] || "#8e8e93"}" title="${esc(PIPELINE_LABELS[k]||k)}: ${pb[k]}">${pb[k]}</div>`).join("")}</div>`);
    parts.push(`<div class="pipe-legend">${steps
      .sort((a,b) => order.indexOf(a) - order.indexOf(b))
      .map(k => `<span><i style="background:${PIPE_COLORS[order.indexOf(k)] || "#8e8e93"}"></i>${esc(PIPELINE_LABELS[k]||k)} ${pb[k]}</span>`).join("")}</div>`);
  } else {
    parts.push(`<div class="empty">Контента нет</div>`);
  }

  parts.push(`<div class="section-title">Активность</div>`);
  parts.push(d.recent_activity && d.recent_activity.length
    ? `<div class="card">${d.recent_activity.map(activityLine).join("")}</div>`
    : `<div class="empty">Пока пусто</div>`);

  view.innerHTML = parts.join("");
}

function statCard(n, label){
  return `<div class="stat"><div class="n">${n ?? 0}</div><div class="l">${esc(label)}</div></div>`;
}

const RENDERERS = { home:renderHome, content:renderContent, ideas:renderIdeas, blockers:renderBlockers, team:renderTeam, dash:renderDashboard };

function setWhoami(u){
  document.getElementById("whoami").textContent = (u && u.role) ? u.role : "";
}

// which FORMS entry the "+" button opens for the current view
function activeFormKey(){
  if (currentTab === "team") return teamSub === "clients" ? "clients" : "team";
  if (currentTab === "dash") return null;
  return currentTab;
}
let accessDenied = false;
function updateFab(){
  const key = activeFormKey();
  let show = !accessDenied && !!(key && FORMS[key]);
  if (key === "clients" || key === "team") show = show && isManager();
  document.getElementById("fab").style.display = show ? "" : "none";
}

async function load(tab){
  currentTab = tab;
  screenTitle.textContent = TITLES[tab];
  document.getElementById("screenLabel").textContent = TITLES[tab];
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === tab));
  updateFab();
  view.innerHTML = `<div class="loader">Загрузка…</div>`;
  try {
    await RENDERERS[tab]();
    accessDenied = false;
  } catch (e){
    if (e && e.detail && e.detail.code === "not_registered"){
      accessDenied = true;
      view.innerHTML = noAccessScreen(e.detail);
    } else {
      view.innerHTML = `<div class="err">${esc(e.message || "Не удалось загрузить")}</div>`;
    }
  }
  updateFab();
}

function noAccessScreen(d){
  const tgid = d && d.telegram_id ? String(d.telegram_id) : "—";
  return `
  <div class="no-access">
    <div class="na-emoji">🔒</div>
    <p class="na-title">Доступ закрыт</p>
    <p class="na-sub">Приложение только для команды. Передай администратору свой Telegram ID:</p>
    <button class="na-id" id="naCopy">${esc(tgid)}</button>
    <p class="na-hint">Нажми, чтобы скопировать</p>
  </div>`;
}

/* ── events ──────────────────────────────────────────────── */

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) { haptic(); load(b.dataset.tab); }
});

view.addEventListener("click", async e => {
  const naCopy = e.target.closest("#naCopy");
  if (naCopy){
    const t = naCopy.textContent.trim();
    try { await navigator.clipboard.writeText(t); } catch(err){}
    haptic(); toast("ID скопирован");
    return;
  }

  const scopeBtn = e.target.closest("[data-scope]");
  if (scopeBtn){
    if (scopeBtn.dataset.scope !== homeScope){ homeScope = scopeBtn.dataset.scope; haptic(); load("home"); }
    return;
  }

  const subBtn = e.target.closest("[data-teamsub]");
  if (subBtn){
    if (subBtn.dataset.teamsub !== teamSub){
      teamSub = subBtn.dataset.teamsub; expandedClient = null; haptic(); load("team");
    }
    return;
  }

  const memberCard = e.target.closest("[data-member]");
  if (memberCard){
    haptic();
    openMemberSheet(+memberCard.dataset.member);
    return;
  }

  const cfilterBtn = e.target.closest("[data-cfilter]");
  if (cfilterBtn){
    const v = cfilterBtn.dataset.cfilter;
    if (String(v) !== String(contentClientId)){ contentClientId = v; haptic(); load("content"); }
    return;
  }

  const clientToggle = e.target.closest("[data-client-toggle]");
  if (clientToggle && !e.target.closest("[data-proj-add],[data-proj-save],.proj-form")){
    const cid = +clientToggle.dataset.clientToggle;
    expandedClient = expandedClient === cid ? null : cid;
    haptic();
    if (expandedClient && !Array.isArray(clientProjects[expandedClient])){
      clientProjects[expandedClient] = null;
      api("/api/projects?client_id=" + expandedClient)
        .then(p => { clientProjects[expandedClient] = p; renderTeam(); })
        .catch(() => { clientProjects[expandedClient] = []; renderTeam(); });
    }
    renderTeam();
    return;
  }

  const projAdd = e.target.closest("[data-proj-add]");
  if (projAdd){
    const f = document.getElementById("projForm-" + projAdd.dataset.projAdd);
    if (f) f.style.display = f.style.display === "none" ? "flex" : "none";
    return;
  }

  const projSave = e.target.closest("[data-proj-save]");
  if (projSave && !busy){
    const cid = +projSave.dataset.projSave;
    const name = (document.getElementById("projName-" + cid).value || "").trim();
    const desc = (document.getElementById("projDesc-" + cid).value || "").trim();
    if (!name){ toast("Укажи название проекта"); return; }
    busy = true; projSave.disabled = true; projSave.textContent = "…";
    try {
      await api("/api/projects", {method:"POST", body:{client_id: cid, name, description: desc || undefined}});
      haptic("medium"); toast("Проект создан");
      clientProjects[cid] = await api("/api/projects?client_id=" + cid);
      renderTeam();
    } catch(err){ toast(err.message); projSave.disabled = false; projSave.textContent = "Создать проект"; }
    finally { busy = false; }
    return;
  }

  const stBtn = e.target.closest("[data-task-to]");
  const advBtn = e.target.closest("[data-advance]");
  const voteBtn = e.target.closest("[data-vote]");
  if (busy) return;

  if (stBtn){
    const orig = stBtn.textContent;
    busy = true; stBtn.disabled = true; stBtn.textContent = "…";
    try {
      await api(`/api/tasks/${stBtn.dataset.taskId}`, {method:"PATCH", body:{status: stBtn.dataset.taskTo}});
      haptic("medium");
      toast(stBtn.dataset.taskTo === "done" ? "Задача закрыта" : "Взято в работу");
      await load(currentTab);
    } catch(err){ toast(err.message); stBtn.disabled = false; stBtn.textContent = orig; }
    finally { busy = false; }
  }

  if (advBtn){
    busy = true; advBtn.disabled = true; advBtn.textContent = "…";
    try {
      const r = await api(`/api/content/${advBtn.dataset.advance}/advance`, {method:"POST"});
      haptic("medium"); toast("→ " + (PIPELINE_LABELS[r.pipeline_status] || r.pipeline_status));
      await load(currentTab);
    } catch(err){ toast(err.message); advBtn.disabled = false; advBtn.textContent = "Продвинуть →"; }
    finally { busy = false; }
  }

  if (voteBtn){
    busy = true;
    try {
      const r = await api(`/api/ideas/${voteBtn.dataset.vote}/vote`, {method:"POST"});
      haptic();
      voteBtn.classList.toggle("on", r.voted);
      voteBtn.querySelector("span").textContent = r.votes_count;
    } catch(err){ toast(err.message); }
    finally { busy = false; }
  }
});

/* ── member action sheet (tap a Команда card) ───────────── */
const memberSheet = document.getElementById("memberSheet");
const memberBackdrop = document.getElementById("memberBackdrop");
let editingMemberId = null;

function askConfirm(q){
  return new Promise(res => {
    if (tg && tg.initData && tg.showConfirm){
      try { tg.showConfirm(q, v => res(!!v)); return; } catch(e){}
    }
    res(window.confirm(q));
  });
}
function closeMemberSheet(){
  memberSheet.classList.remove("open");
  memberBackdrop.classList.remove("open");
  editingMemberId = null;
}
function openMemberSheet(id){
  const u = teamById[id];
  if (!u) return;
  editingMemberId = id;
  const self = ME && id === ME.id;
  document.getElementById("memberName").textContent = u.full_name || ("ID " + u.telegram_id);
  document.getElementById("memberFullName").value = u.full_name || "";
  const sel = document.getElementById("memberRole");
  const roles = self ? ["admin", "am"] : Object.keys(ROLE_LABELS);
  sel.innerHTML = roles.map(r =>
    `<option value="${r}"${r === u.role ? " selected" : ""}>${ROLE_LABELS[r] || r}</option>`).join("");
  document.getElementById("memberDelete").hidden = self;
  document.getElementById("memberSave").disabled = false;
  memberBackdrop.classList.add("open");
  memberSheet.classList.add("open");
}

document.getElementById("memberSave").addEventListener("click", async () => {
  if (editingMemberId == null || busy) return;
  const role = document.getElementById("memberRole").value;
  const full_name = document.getElementById("memberFullName").value.trim();
  if (!full_name){ toast("Имя не может быть пустым"); return; }
  busy = true; document.getElementById("memberSave").disabled = true;
  try {
    await api(`/api/team/${editingMemberId}/role`, {method:"PATCH", body:{role, full_name}});
    haptic("medium"); toast("Сохранено");
    closeMemberSheet();
    await load("team");
  } catch(err){ toast(err.message); document.getElementById("memberSave").disabled = false; }
  finally { busy = false; }
});

document.getElementById("memberDelete").addEventListener("click", async () => {
  if (editingMemberId == null || busy) return;
  const u = teamById[editingMemberId] || {};
  if (!(await askConfirm(`Убрать «${u.full_name || "этого человека"}» из команды? Доступ пропадёт.`))) return;
  busy = true;
  try {
    await api(`/api/team/${editingMemberId}`, {method:"DELETE"});
    haptic("medium"); toast("Удалён из команды");
    closeMemberSheet();
    await load("team");
  } catch(err){ toast(err.message); }
  finally { busy = false; }
});

memberBackdrop.addEventListener("click", closeMemberSheet);

const sheet = document.getElementById("sheet");
const sheetBackdrop = document.getElementById("sheetBackdrop");
const formFields = document.getElementById("formFields");
const formErr = document.getElementById("formErr");
const formSubmit = document.getElementById("formSubmit");

function setFormError(msg){
  if (!msg){ formErr.style.display = "none"; return; }
  formErr.textContent = msg; formErr.style.display = "block";
}

function _baseOptions(f){
  return (f.options || [["",""]]).map(([v,l]) =>
    `<option value="${esc(v)}"${v === (f.value ?? "") ? " selected" : ""}>${esc(l)}</option>`).join("");
}

async function fillDynamic(f){
  const sel = document.getElementById("f_" + f.name);
  if (!sel) return;
  const keep = sel.value;
  sel.innerHTML = _baseOptions(f);
  try {
    let items = [];
    if (f.dynamic === "team"){
      items = (await api("/api/team")).map(u => [u.id, `${u.full_name} (${ROLE_LABELS[u.role] || u.role})`]);
    } else if (f.dynamic === "clients"){
      items = (await api("/api/clients")).map(c => [c.id, c.name]);
    } else if (f.dynamic === "projects"){
      const dep = f.dependsOn ? document.getElementById("f_" + f.dependsOn) : null;
      const cid = dep && dep.value;
      if (!cid){ sel.disabled = true; return; }
      sel.disabled = false;
      items = (await api("/api/projects?client_id=" + encodeURIComponent(cid))).map(p => [p.id, p.name]);
    }
    if (!sel.isConnected) return;
    items.forEach(([v,l]) => {
      const o = document.createElement("option");
      o.value = v; o.textContent = l; sel.appendChild(o);
    });
    if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
  } catch(e){
    if (f.dynamic !== "projects"){
      sel.disabled = true;
      const lbl = sel.previousElementSibling;
      if (lbl && !/—/.test(lbl.textContent)) lbl.textContent += " — недоступно";
    }
  }
}

async function openSheet(){
  const cfg = FORMS[activeFormKey()];
  if (!cfg) return;
  document.getElementById("sheetTitle").textContent = cfg.title;
  setFormError("");
  formFields.innerHTML = cfg.fields.map(f => {
    const id = "f_" + f.name;
    let control;
    if (f.type === "textarea"){
      control = `<textarea id="${id}"></textarea>`;
    } else if (f.type === "select"){
      control = `<select id="${id}">${_baseOptions(f)}</select>`;
    } else {
      const t = f.type === "number" ? "number" : (f.type === "date" ? "date" : "text");
      control = `<input id="${id}" type="${t}"${f.type === "number" ? ' inputmode="numeric"' : ""}>`;
    }
    return `<div class="field" data-field="${f.name}">
      <label for="${id}">${esc(f.label)}${f.required ? " *" : ""}</label>${control}
    </div>`;
  }).join("");
  formSubmit.disabled = false; formSubmit.textContent = "Создать";
  sheetBackdrop.classList.add("open");
  sheet.classList.add("open");

  // wire dependent selects (project list follows the chosen client)
  for (const f of cfg.fields){
    if (!f.dependsOn) continue;
    const dep = document.getElementById("f_" + f.dependsOn);
    if (dep) dep.addEventListener("change", () => fillDynamic(f));
  }
  // populate dynamic option lists (projects self-disable until a client is picked)
  for (const f of cfg.fields){
    if (f.dynamic) await fillDynamic(f);
  }
}

function closeSheet(){
  sheet.classList.remove("open");
  sheetBackdrop.classList.remove("open");
}

async function submitForm(){
  const cfg = FORMS[activeFormKey()];
  if (!cfg || busy) return;
  const body = {};
  let valid = true;
  formFields.querySelectorAll(".field").forEach(w => w.classList.remove("bad"));
  for (const f of cfg.fields){
    const el = document.getElementById("f_" + f.name);
    const raw = (el.value || "").trim();
    if (f.required && !raw){
      el.closest(".field").classList.add("bad"); valid = false; continue;
    }
    if (raw === "") continue;
    if (f.type === "number" || f.coerce === "int"){
      const n = parseInt(raw, 10);
      if (!Number.isNaN(n)) body[f.name] = n;
    } else {
      body[f.name] = raw;
    }
  }
  if (!valid){ setFormError("Заполни обязательные поля"); return; }

  busy = true;
  formSubmit.disabled = true; formSubmit.textContent = "Сохранение…";
  setFormError("");
  try {
    await api(cfg.endpoint, { method:"POST", body });
    haptic("medium");
    closeSheet();
    toast("Создано");
    await load(currentTab);
  } catch(e){
    setFormError(e.message || "Не удалось сохранить");
    formSubmit.disabled = false; formSubmit.textContent = "Создать";
  } finally {
    busy = false;
  }
}

document.getElementById("fab").addEventListener("click", () => { haptic(); openSheet(); });
sheetBackdrop.addEventListener("click", closeSheet);
formSubmit.addEventListener("click", submitForm);

/* ── pull-to-refresh (like YouTube) ─────────────────────── */
(function pullToRefresh(){
  const ptr = document.getElementById("ptr");
  const MAX = 72, TRIGGER = 56;
  let y0 = 0, active = false, dist = 0;

  view.addEventListener("touchstart", (e) => {
    if (view.scrollTop <= 0 && !busy && e.touches.length === 1){
      y0 = e.touches[0].clientY; active = true; dist = 0;
      ptr.classList.remove("anim");
    }
  }, {passive:true});

  view.addEventListener("touchmove", (e) => {
    if (!active) return;
    dist = e.touches[0].clientY - y0;
    if (dist <= 0){ ptr.style.height = "0px"; return; }
    const h = Math.min(dist * 0.5, MAX);
    ptr.style.height = h + "px";
    ptr.querySelector("span").style.opacity = Math.min(h / TRIGGER, 1);
  }, {passive:true});

  async function end(){
    if (!active) return;
    active = false;
    ptr.classList.add("anim");
    if (dist * 0.5 >= TRIGGER){
      ptr.style.height = "40px";
      ptr.classList.add("spin");
      haptic("light");
      try { await load(currentTab); } finally {
        ptr.classList.remove("spin");
        ptr.style.height = "0px";
      }
    } else {
      ptr.style.height = "0px";
    }
    dist = 0;
  }
  view.addEventListener("touchend", end, {passive:true});
  view.addEventListener("touchcancel", end, {passive:true});
})();

load("home");
