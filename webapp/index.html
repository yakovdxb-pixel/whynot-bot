<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WHY NOT? OS</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#330a3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WHY NOT? OS">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #0f0f0f);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --sep: color-mix(in srgb, var(--hint) 25%, transparent);
    --st-pending:#8a8a8e;
    --st-in_progress:#2481cc;
    --st-done:#34c759;
    --st-overdue:#ff3b30;
    --st-cancelled:#8a8a8e;
    --fab:#1ec89a;   /* WHY NOT? brand mint */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    padding:14px 16px 10px; border-bottom:1px solid var(--sep);
    display:flex; align-items:center; justify-content:space-between;
  }
  header h1{font-size:18px; font-weight:700; margin:0}
  header .sub{font-size:12px; color:var(--hint); margin-top:2px}
  .refresh{
    background:none; border:none; color:var(--link);
    font-size:22px; padding:4px 6px; cursor:pointer; line-height:1;
  }
  main{padding:14px 16px}
  .section-title{font-size:13px; font-weight:600; color:var(--hint);
    text-transform:uppercase; letter-spacing:.04em; margin:18px 2px 8px}
  .section-title:first-child{margin-top:4px}

  .card{
    background:var(--card); border-radius:14px; padding:13px 14px;
    margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .card .row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .card .title{font-weight:600; font-size:15px; margin:0}
  .card .desc{color:var(--hint); font-size:13px; margin:5px 0 0; white-space:pre-wrap}
  .card .meta{color:var(--hint); font-size:12px; margin-top:7px; display:flex; gap:10px; flex-wrap:wrap}

  .pill{
    display:inline-block; font-size:11px; font-weight:600; padding:3px 9px;
    border-radius:999px; color:#fff; white-space:nowrap; text-transform:lowercase;
  }
  .pill.pending{background:var(--st-pending)}
  .pill.in_progress{background:var(--st-in_progress)}
  .pill.done{background:var(--st-done)}
  .pill.overdue{background:var(--st-overdue)}
  .pill.cancelled{background:var(--st-cancelled)}
  .pill.stage{background:var(--link)}

  button.act{
    margin-top:11px; width:100%; border:none; border-radius:10px;
    background:var(--btn); color:var(--btn-text);
    font-size:14px; font-weight:600; padding:10px; cursor:pointer;
  }
  button.act:active{opacity:.7}
  button.act.ghost{background:transparent; color:var(--link); border:1px solid var(--sep)}
  button.act[disabled]{opacity:.45; cursor:default}

  .seg{
    display:flex; background:var(--card); border-radius:10px; padding:3px;
    margin:2px 0 12px;
  }
  .seg button{
    flex:1; border:none; background:none; color:var(--hint); cursor:pointer;
    font-size:13px; font-weight:600; padding:7px 0; border-radius:8px;
  }
  .seg button.on{background:var(--bg); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12)}

  .done-mark{margin-top:10px; text-align:center; color:var(--st-done); font-weight:600; font-size:14px}

  .pills-row{
    display:flex; gap:6px; overflow-x:auto; margin:2px 0 12px; padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
  }
  .pills-row::-webkit-scrollbar{display:none}
  .pill-btn{
    flex:0 0 auto; border:1px solid var(--sep); background:transparent; color:var(--hint);
    border-radius:999px; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer;
    white-space:nowrap;
  }
  .pill-btn.on{background:var(--btn); color:var(--btn-text); border-color:transparent}

  .client-card .row{cursor:pointer}
  .proj-block{margin-top:12px; border-top:1px solid var(--sep); padding-top:10px}
  .proj-item{font-size:14px; padding:5px 0}
  .proj-item .hint{color:var(--hint)}
  .proj-form{margin-top:8px; display:flex; flex-direction:column; gap:8px}
  .proj-form input, .proj-form textarea{
    width:100%; font:14px inherit; color:var(--text); background:var(--bg);
    border:1px solid var(--sep); border-radius:9px; padding:8px 10px; outline:none;
  }
  .proj-form textarea{min-height:52px; resize:vertical}

  .vote{
    display:flex; align-items:center; gap:6px; border:1px solid var(--sep);
    background:transparent; color:var(--text); border-radius:999px;
    padding:6px 12px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .vote.on{background:var(--btn); color:var(--btn-text); border-color:transparent}

  .empty{color:var(--hint); text-align:center; padding:34px 10px; font-size:14px}
  .loader{color:var(--hint); text-align:center; padding:34px 10px}
  .err{
    background:color-mix(in srgb, var(--st-overdue) 14%, transparent);
    color:var(--st-overdue); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:10px;
  }

  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; background:var(--bg); border-top:1px solid var(--sep);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; background:none; border:none; cursor:pointer;
    padding:8px 1px 6px; color:var(--hint); font-size:9px; letter-spacing:-.2px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav button .ic{font-size:19px; line-height:1}
  nav button.active{color:var(--link)}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px}
  .stat{background:var(--card); border-radius:14px; padding:13px 14px; box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .stat .n{font-size:26px; font-weight:800; line-height:1.1}
  .stat .l{font-size:12px; color:var(--hint); margin-top:4px}

  .wl-row{background:var(--card); border-radius:12px; padding:11px 13px; margin-bottom:8px}
  .wl-top{display:flex; justify-content:space-between; align-items:baseline; font-size:14px}
  .wl-top .open{color:var(--hint); font-size:12px}
  .bar{height:7px; border-radius:4px; background:var(--sep); margin-top:8px; overflow:hidden}
  .bar > i{display:block; height:100%; border-radius:4px}
  .bar-g{background:var(--st-done)} .bar-y{background:#ffcc00} .bar-r{background:var(--st-overdue)}
  .wl-sub{font-size:11px; color:var(--hint); margin-top:5px}

  .pipe-bar{display:flex; height:26px; border-radius:8px; overflow:hidden; margin:4px 0 8px}
  .pipe-seg{display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; min-width:22px}
  .pipe-legend{display:flex; flex-wrap:wrap; gap:8px 14px; font-size:11px; color:var(--hint)}
  .pipe-legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:middle}

  .act-row{font-size:13px; padding:8px 0; border-bottom:1px solid var(--sep)}
  .act-row:last-child{border-bottom:none}
  .act-row .ago{color:var(--hint); font-size:11px; margin-left:4px}

  .role-select{
    width:100%; margin-top:10px; font:14px inherit; color:var(--text);
    background:var(--bg); border:1px solid var(--sep); border-radius:9px;
    padding:8px 10px; -webkit-appearance:none; appearance:none;
  }

  #installBanner{
    display:flex; align-items:center; gap:10px;
    background:#6c5ce7; color:#fff;
    padding:10px 12px; font-size:13px; line-height:1.35;
  }
  #installBanner[hidden]{display:none}
  #installBanner #installText{flex:1}
  #installBanner #installBtn{
    flex:0 0 auto; border:none; border-radius:8px; cursor:pointer;
    background:#fff; color:#6c5ce7; font-size:13px; font-weight:700; padding:8px 12px;
  }
  #installBanner #installBtn[hidden]{display:none}
  #installBanner #installClose{
    flex:0 0 auto; border:none; background:transparent; color:#fff;
    font-size:20px; line-height:1; cursor:pointer; padding:0 2px;
  }

  .toast{
    position:fixed; left:50%; bottom:78px; transform:translateX(-50%);
    background:#000; color:#fff; padding:9px 16px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20;
    max-width:88%;
  }
  .toast.show{opacity:.92}

  /* ── floating + button ─────────────────────────────────── */
  .fab{
    position:fixed; right:16px; z-index:15;
    bottom:calc(64px + env(safe-area-inset-bottom) + 14px);
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:var(--fab, #ff6b5e); color:#fff; font-size:28px; line-height:52px;
    box-shadow:0 4px 14px rgba(0,0,0,.28); padding:0;
    transition:transform .12s;
  }
  .fab:active{transform:scale(.9)}

  /* ── bottom-sheet modal ────────────────────────────────── */
  .sheet-backdrop{
    position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:31;
    background:var(--bg); color:var(--text);
    border-radius:16px 16px 0 0; padding:8px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .26s cubic-bezier(.32,.72,0,1);
    max-height:88vh; overflow-y:auto;
  }
  .sheet.open{transform:translateY(0)}
  .sheet .grabber{width:36px; height:4px; border-radius:2px; background:var(--sep);
    margin:6px auto 12px}
  .sheet h2{font-size:17px; font-weight:700; margin:0 0 14px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12px; color:var(--hint); margin-bottom:5px}
  .field input, .field textarea, .field select{
    width:100%; font:15px inherit; color:var(--text);
    background:var(--card); border:1px solid var(--sep); border-radius:10px;
    padding:10px 12px; outline:none; -webkit-appearance:none; appearance:none;
  }
  .field textarea{min-height:74px; resize:vertical}
  .field select{background-image:none}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--link)}
  .field.bad input, .field.bad textarea, .field.bad select{border-color:var(--st-overdue)}
  .sheet .form-err{
    background:color-mix(in srgb, var(--st-overdue) 14%, transparent);
    color:var(--st-overdue); border-radius:10px; padding:9px 12px; font-size:13px; margin-bottom:10px;
  }
  .sheet .submit{
    width:100%; border:none; border-radius:12px; margin-top:4px;
    background:var(--btn); color:var(--btn-text); font-size:15px; font-weight:600;
    padding:13px; cursor:pointer;
  }
  .sheet .submit[disabled]{opacity:.55; cursor:default}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="screenTitle">Главная</h1>
    <div class="sub" id="whoami">…</div>
  </div>
  <button class="refresh" id="refreshBtn" aria-label="Обновить">⟳</button>
</header>

<div id="installBanner" hidden>
  <span id="installText"></span>
  <button id="installBtn" hidden>📲 Установить приложение</button>
  <button id="installClose" aria-label="Закрыть">×</button>
</div>

<main id="view"><div class="loader">Загрузка…</div></main>

<nav>
  <button data-tab="home"     class="active"><span class="ic">🏠</span>Главная</button>
  <button data-tab="content"><span class="ic">📋</span>Контент</button>
  <button data-tab="ideas"><span class="ic">💡</span>Идеи</button>
  <button data-tab="blockers"><span class="ic">🚫</span>Блокеры</button>
  <button data-tab="team"><span class="ic">👥</span>Команда</button>
  <button data-tab="dash"><span class="ic">📊</span>Обзор</button>
</nav>

<button class="fab" id="fab" aria-label="Создать">+</button>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grabber"></div>
  <h2 id="sheetTitle"></h2>
  <div class="form-err" id="formErr" style="display:none"></div>
  <div id="formFields"></div>
  <button class="submit" id="formSubmit">Создать</button>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
const INIT_DATA = (tg && tg.initData) || "";

/* ── PWA install banner ─────────────────────────────────── */
(function installBanner(){
  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;
  const inTelegram = !!(tg && tg.initData);       // can't install a PWA from inside Telegram
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

  const bar   = document.getElementById("installBanner");
  const txt   = document.getElementById("installText");
  const btn   = document.getElementById("installBtn");
  const close = document.getElementById("installClose");
  let deferred = null;

  function dismissed(){ try { return localStorage.getItem("wn_install_dismissed") === "1"; } catch(e){ return false; } }
  function hide(){ bar.hidden = true; }
  function show(){ if (!isStandalone && !inTelegram && !dismissed()) bar.hidden = false; }

  close.addEventListener("click", () => {
    try { localStorage.setItem("wn_install_dismissed", "1"); } catch(e){}
    hide();
  });

  if (isStandalone || inTelegram) return;   // nothing to offer

  if (isIOS){
    txt.innerHTML = 'Установи как приложение: <b>Поделиться</b> ⬆️ → <b>На экран «Домой»</b>';
    btn.hidden = true;
    show();
  }

  window.addEventListener("beforeinstallprompt", (e) => {   // Android / desktop Chrome
    e.preventDefault();
    deferred = e;
    txt.textContent = "Установить WHY NOT? OS на телефон";
    btn.hidden = false;
    show();
  });

  btn.addEventListener("click", async () => {
    if (!deferred) return;
    btn.disabled = true;
    deferred.prompt();
    try { await deferred.userChoice; } catch(e){}
    deferred = null;
    hide();
  });

  window.addEventListener("appinstalled", () => {
    try { localStorage.setItem("wn_install_dismissed", "1"); } catch(e){}
    hide();
  });
})();

const TITLES = { home:"Главная", content:"Контент", ideas:"Идеи", blockers:"Блокеры", team:"Команда", dash:"Обзор" };
const ENTITY_NOUN = { task:"задачу", content:"контент", idea:"идею", blocker:"блокер", project:"проект", client:"клиента", user:"пользователя" };
const ACTION_VERB = { created:"создал", updated:"обновил", completed:"завершил", moved:"продвинул", voted:"проголосовал за", vote_changed:"переголосовал за", assigned:"назначил", resolved:"закрыл" };
const ROLE_LABELS = {
  admin:"Админ", am:"AM", producer:"Продюсер", smm:"SMM", photographer:"Фотограф",
  editor:"Монтажёр", designer:"Дизайнер", copywriter:"Копирайтер", intern:"Стажёр"
};
const ROLE_COLORS = {
  admin:"#8e44ad", am:"#2481cc", smm:"#34c759", designer:"#ff9500",
  photographer:"#ffcc00", editor:"#1abc9c", intern:"#8a8a8e"
};
const PIPELINE_LABELS = {
  idea:"Идея", approval:"Согласование", script:"Сценарий", shoot:"Съёмка",
  edit:"Монтаж", review:"Ревью", client:"У клиента", revisions:"Правки",
  done:"Готово", published:"Опубликовано", analytics:"Аналитика"
};
const STATUS_LABELS = {
  pending:"ожидает", in_progress:"в работе", done:"готово",
  overdue:"просрочено", cancelled:"отменено"
};
// which status button a task card shows, keyed by current status
const TASK_NEXT = {
  pending:     { to:"in_progress", label:"▶ В работу" },
  overdue:     { to:"in_progress", label:"▶ В работу" },
  in_progress: { to:"done",        label:"✅ Готово" },
};

const view = document.getElementById("view");
const screenTitle = document.getElementById("screenTitle");
let currentTab = "home";
let homeScope = "mine";   // "mine" | "all" — Главная tasks filter
let teamSub = "team";     // "team" | "clients" — Команда sub-section
let contentClientId = ""; // "" = all — Контент client filter
let expandedClient = null;
let clientProjects = {};  // clientId -> projects array | null(loading)
let ME = null;            // current user {id, role, full_name, registered, ...}
let busy = false;

function isManager(){ return !!(ME && (ME.role === "admin" || ME.role === "am")); }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}
function haptic(kind){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind||"light"); }catch(e){} }

async function api(path, opts){
  opts = opts || {};
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: {
      "Content-Type": "application/json",
      "X-Init-Data": INIT_DATA,
      "X-Telegram-Init-Data": INIT_DATA,
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok){
    const msg = (data && (data.detail || data.message)) || ("Ошибка " + res.status);
    throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
  }
  return data;
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]
));
function fmtDate(v){
  if(!v) return null;
  const d = new Date(v);
  if(isNaN(d)) return String(v);
  return d.toLocaleDateString("ru-RU", {day:"2-digit", month:"short"});
}
function deadlineMeta(v){
  const f = fmtDate(v);
  return f ? `⏰ ${f}` : "⏰ без срока";
}

function taskCard(t){
  const st = t.status || "pending";
  const next = TASK_NEXT[st];
  return `
  <div class="card" data-task="${t.id}">
    <div class="row">
      <p class="title">${esc(t.title || "Без названия")}</p>
      <span class="pill ${esc(st)}">${esc(STATUS_LABELS[st] || st)}</span>
    </div>
    ${t.description ? `<p class="desc">${esc(t.description)}</p>` : ""}
    <div class="meta">
      <span>${deadlineMeta(t.deadline)}</span>
      ${t.assignee_name ? `<span>👤 ${esc(t.assignee_name)}</span>` : ""}
      ${t.priority && t.priority !== "normal" ? `<span>❗ ${esc(t.priority)}</span>` : ""}
    </div>
    ${next
      ? `<button class="act" data-task-to="${next.to}" data-task-id="${t.id}">${next.label}</button>`
      : st === "done" ? `<div class="done-mark">✅ Выполнено</div>` : ""}
  </div>`;
}

function blockerCard(b){
  return `
  <div class="card">
    <div class="row">
      <p class="title">🚫 ${esc(b.title || "Блокер")}</p>
    </div>
    ${b.description ? `<p class="desc">${esc(b.description)}</p>` : ""}
    <div class="meta">
      ${b.reported_by_name ? `<span>сообщил: ${esc(b.reported_by_name)}</span>` : ""}
      ${b.assigned_to_name ? `<span>на: ${esc(b.assigned_to_name)}</span>` : ""}
      ${b.created_at ? `<span>${esc(fmtDate(b.created_at))}</span>` : ""}
    </div>
  </div>`;
}

/* ── screens ─────────────────────────────────────────────── */

async function renderHome(){
  const [d, tasks] = await Promise.all([
    api("/api/home"),
    api("/api/tasks?my=" + (homeScope === "mine" ? "true" : "false")),
  ]);
  ME = d.user;
  setWhoami(d.user);
  const parts = [];

  parts.push(`
    <div class="seg" id="scopeSeg">
      <button data-scope="mine" class="${homeScope === "mine" ? "on" : ""}">Мои</button>
      <button data-scope="all"  class="${homeScope === "all"  ? "on" : ""}">Все</button>
    </div>`);

  parts.push(`<div class="section-title">Задачи</div>`);
  parts.push(tasks.length
    ? tasks.map(taskCard).join("")
    : `<div class="empty">${homeScope === "mine" ? "Нет задач 🎉" : "Задач нет"}</div>`);

  parts.push(`<div class="section-title">Мои блокеры</div>`);
  parts.push(d.my_blockers.length
    ? d.my_blockers.map(blockerCard).join("")
    : `<div class="empty">Блокеров нет</div>`);

function contentCard(c, {advance=true}={}){
  const st = c.pipeline_status || "idea";
  const isFinal = st === "analytics";
  return `
  <div class="card" data-content="${c.id}">
    <div class="row">
      <p class="title">${esc(c.topic || c.number || ("Контент #" + c.id))}</p>
      <span class="pill stage">${esc(PIPELINE_LABELS[st] || st)}</span>
    </div>
    ${c.description ? `<p class="desc">${esc(c.description)}</p>` : ""}
    <div class="meta">
      ${c.format ? `<span>🎞 ${esc(c.format)}</span>` : ""}
      ${c.publish_date ? `<span>📅 ${esc(fmtDate(c.publish_date))}</span>` : ""}
      ${c.client_approved ? `<span>✅ клиент</span>` : ""}
    </div>
    ${advance && !isFinal ? `<button class="act" data-advance="${c.id}">Продвинуть →</button>` : ""}
    ${advance && isFinal ? `<button class="act ghost" disabled>Финальный этап</button>` : ""}
  </div>`;
}

async function renderContent(){
  const [clients, items] = await Promise.all([
    api("/api/clients").catch(() => []),
    api("/api/content" + (contentClientId ? "?client_id=" + encodeURIComponent(contentClientId) : "")),
  ]);
  const pills = `<div class="pills-row">
    <button class="pill-btn ${contentClientId === "" ? "on" : ""}" data-cfilter="">Все</button>
    ${clients.map(c => `<button class="pill-btn ${String(contentClientId) === String(c.id) ? "on" : ""}" data-cfilter="${c.id}">${esc(c.name)}</button>`).join("")}
  </div>`;

  const order = ["idea","approval","script","shoot","edit","review","client","revisions","done","published","analytics"];
  const groups = {};
  items.forEach(c => { (groups[c.pipeline_status] ||= []).push(c); });
  const parts = [pills];
  if (!items.length){
    parts.push(`<div class="empty">${contentClientId ? "У клиента нет контента" : "Контента пока нет"}</div>`);
  } else {
    order.forEach(st => {
      if (!groups[st]) return;
      parts.push(`<div class="section-title">${PIPELINE_LABELS[st] || st} · ${groups[st].length}</div>`);
      parts.push(groups[st].map(c => contentCard(c)).join(""));
    });
  }
  view.innerHTML = parts.join("");
}

function timeAgo(iso){
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "только что";
  if (s < 3600) return Math.floor(s / 60) + " мин назад";
  if (s < 86400) return Math.floor(s / 3600) + " ч назад";
  return Math.floor(s / 86400) + " дн назад";
}

function activityLine(a){
  const who = esc(a.actor_name || "Кто-то");
  const verb = ACTION_VERB[a.action] || a.action;
  const noun = ENTITY_NOUN[a.entity] || a.entity;
  const t = a.title ? ` «${esc(a.title)}»` : "";
  return `<div class="act-row">${who} ${verb} ${noun}${t}<span class="ago">· ${esc(timeAgo(a.happened_at))}</span></div>`;
}

async function renderDashboard(){
  let d;
  try {
    d = await api("/api/dashboard");
  } catch(e){
    view.innerHTML = `<div class="empty">${esc(e.message || "Обзор доступен только админам и AM")}</div>`;
    return;
  }
  const parts = [];

  parts.push(`<div class="stat-grid">
    ${statCard(d.open_tasks, "Задач открыто")}
    ${statCard(d.active_blockers, "Блокеров активных")}
    ${statCard(d.content_in_progress, "Контента в работе")}
    ${statCard(d.active_ideas, "Идей на голосовании")}
  </div>`);

  parts.push(`<div class="section-title">Загрузка команды</div>`);
  if (d.team_workload.length){
    parts.push(d.team_workload.map(w => {
      const total = w.total_this_month || 0, done = w.done_this_month || 0;
      const rate = total ? done / total : 0;
      const cls = !total ? "" : rate > 0.7 ? "bar-g" : rate > 0.4 ? "bar-y" : "bar-r";
      const pct = total ? Math.round(rate * 100) : 0;
      return `<div class="wl-row">
        <div class="wl-top"><span>${esc(w.name)}</span><span class="open">${w.open_tasks} откр.</span></div>
        <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
        <div class="wl-sub">${done}/${total} задач за месяц${total ? " · " + pct + "%" : ""}</div>
      </div>`;
    }).join(""));
  } else {
    parts.push(`<div class="empty">Нет данных</div>`);
  }

  parts.push(`<div class="section-title">Контент по этапам</div>`);
  const pb = d.pipeline_breakdown || {};
  const steps = Object.keys(pb).filter(k => pb[k] > 0);
  const totalC = steps.reduce((s,k) => s + pb[k], 0);
  if (totalC){
    const order = ["idea","approval","script","shoot","edit","review","client","revisions","done","published","analytics"];
    parts.push(`<div class="pipe-bar">${steps
      .sort((a,b) => order.indexOf(a) - order.indexOf(b))
      .map(k => `<div class="pipe-seg" style="flex:${pb[k]};background:${PIPE_COLORS[order.indexOf(k)] || "#8e8e93"}" title="${esc(PIPELINE_LABELS[k]||k)}: ${pb[k]}">${pb[k]}</div>`).join("")}</div>`);
    parts.push(`<div class="pipe-legend">${steps
      .sort((a,b) => order.indexOf(a) - order.indexOf(b))
      .map(k => `<span><i style="background:${PIPE_COLORS[order.indexOf(k)] || "#8e8e93"}"></i>${esc(PIPELINE_LABELS[k]||k)} ${pb[k]}</span>`).join("")}</div>`);
  } else {
    parts.push(`<div class="empty">Контента нет</div>`);
  }

  parts.push(`<div class="section-title">Активность</div>`);
  parts.push(d.recent_activity && d.recent_activity.length
    ? `<div class="card">${d.recent_activity.map(activityLine).join("")}</div>`
    : `<div class="empty">Пока пусто</div>`);

  view.innerHTML = parts.join("");
}

async function load(tab){
  currentTab = tab;
  screenTitle.textContent = TITLES[tab];
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === tab));
  updateFab();
  view.innerHTML = `<div class="loader">Загрузка…</div>`;
  try {
    await RENDERERS[tab]();
  } catch (e){
    view.innerHTML = `<div class="err">${esc(e.message || "Не удалось загрузить")}</div>`;
  }
  updateFab();
}

view.addEventListener("click", async e => {

  if (scopeBtn){
    if (scopeBtn.dataset.scope !== homeScope){ homeScope = scopeBtn.dataset.scope; haptic(); load("home"); }
    return;
  }

  const subBtn = e.target.closest("[data-teamsub]");
  if (subBtn){
    if (subBtn.dataset.teamsub !== teamSub){
      teamSub = subBtn.dataset.teamsub; expandedClient = null; haptic(); load("team");
    }
    return;
  }

  const cfilterBtn = e.target.closest("[data-cfilter]");
  if (cfilterBtn){
    const v = cfilterBtn.dataset.cfilter;
    if (String(v) !== String(contentClientId)){ contentClientId = v; haptic(); load("content"); }
    return;
  }

  const clientToggle = e.target.closest("[data-client-toggle]");
  if (clientToggle && !e.target.closest("[data-proj-add],[data-proj-save],.proj-form")){
    const cid = +clientToggle.dataset.clientToggle;
    expandedClient = expandedClient === cid ? null : cid;
    haptic();
    if (expandedClient && !Array.isArray(clientProjects[expandedClient])){
      clientProjects[expandedClient] = null;
      api("/api/projects?client_id=" + expandedClient)
        .then(p => { clientProjects[expandedClient] = p; renderTeam(); })
        .catch(() => { clientProjects[expandedClient] = []; renderTeam(); });
    }
    renderTeam();
    return;
  }

  const projAdd = e.target.closest("[data-proj-add]");
  if (projAdd){
    const f = document.getElementById("projForm-" + projAdd.dataset.projAdd);
    if (f) f.style.display = f.style.display === "none" ? "flex" : "none";
    return;
  }

  const projSave = e.target.closest("[data-proj-save]");
  if (projSave && !busy){
    const cid = +projSave.dataset.projSave;
    const name = (document.getElementById("projName-" + cid).value || "").trim();
    const desc = (document.getElementById("projDesc-" + cid).value || "").trim();
    if (!name){ toast("Укажи название проекта"); return; }
    busy = true; projSave.disabled = true; projSave.textContent = "…";
    try {
      await api("/api/projects", {method:"POST", body:{client_id: cid, name, description: desc || undefined}});
      haptic("medium"); toast("Проект создан");
      clientProjects[cid] = await api("/api/projects?client_id=" + cid);
      renderTeam();
    } catch(err){ toast(err.message); projSave.disabled = false; projSave.textContent = "Создать проект"; }
    finally { busy = false; }
    return;
  }

  const stBtn = e.target.closest("[data-task-to]");
  const advBtn = e.target.closest("[data-advance]");
  const voteBtn = e.target.closest("[data-vote]");
  if (busy) return;

  if (stBtn){
    const orig = stBtn.textContent;
    busy = true; stBtn.disabled = true; stBtn.textContent = "…";
    try {
      await api(`/api/tasks/${stBtn.dataset.taskId}`, {method:"PATCH", body:{status: stBtn.dataset.taskTo}});
      haptic("medium");
      toast(stBtn.dataset.taskTo === "done" ? "Задача закрыта" : "Взято в работу");
      await load(currentTab);
    } catch(err){ toast(err.message); stBtn.disabled = false; stBtn.textContent = orig; }
    finally { busy = false; }
  }

  if (advBtn){
    busy = true; advBtn.disabled = true; advBtn.textContent = "…";
    try {
      const r = await api(`/api/content/${advBtn.dataset.advance}/advance`, {method:"POST"});
      haptic("medium"); toast("→ " + (PIPELINE_LABELS[r.pipeline_status] || r.pipeline_status));
      await load(currentTab);
    } catch(err){ toast(err.message); advBtn.disabled = false; advBtn.textContent = "Продвинуть →"; }
    finally { busy = false; }
  }

  if (voteBtn){
    busy = true;
    try {
      const r = await api(`/api/ideas/${voteBtn.dataset.vote}/vote`, {method:"POST"});
      haptic();
      voteBtn.classList.toggle("on", r.voted);
      voteBtn.querySelector("span").textContent = r.votes_count;
    } catch(err){ toast(err.message); }
    finally { busy = false; }
  }
});

function _baseOptions(f){
  return (f.options || [["",""]]).map(([v,l]) =>
    `<option value="${esc(v)}"${v === (f.value ?? "") ? " selected" : ""}>${esc(l)}</option>`).join("");
}

async function fillDynamic(f){
  const sel = document.getElementById("f_" + f.name);
  if (!sel) return;
  const keep = sel.value;
  sel.innerHTML = _baseOptions(f);
  try {
    let items = [];
    if (f.dynamic === "team"){
      items = (await api("/api/team")).map(u => [u.id, `${u.full_name} (${ROLE_LABELS[u.role] || u.role})`]);
    } else if (f.dynamic === "clients"){
      items = (await api("/api/clients")).map(c => [c.id, c.name]);
    } else if (f.dynamic === "projects"){
      const dep = f.dependsOn ? document.getElementById("f_" + f.dependsOn) : null;
      const cid = dep && dep.value;
      if (!cid){ sel.disabled = true; return; }
      sel.disabled = false;
      items = (await api("/api/projects?client_id=" + encodeURIComponent(cid))).map(p => [p.id, p.name]);
    }
    if (!sel.isConnected) return;
    items.forEach(([v,l]) => {
      const o = document.createElement("option");
      o.value = v; o.textContent = l; sel.appendChild(o);
    });
    if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
  } catch(e){
    if (f.dynamic !== "projects"){
      sel.disabled = true;
      const lbl = sel.previousElementSibling;
      if (lbl && !/—/.test(lbl.textContent)) lbl.textContent += " — недоступно";
    }
  }
}

async function openSheet(){
  const cfg = FORMS[activeFormKey()];
  if (!cfg) return;
  document.getElementById("sheetTitle").textContent = cfg.title;
  setFormError("");
  formFields.innerHTML = cfg.fields.map(f => {
    const id = "f_" + f.name;
    let control;
    if (f.type === "textarea"){
      control = `<textarea id="${id}"></textarea>`;
    } else if (f.type === "select"){
      control = `<select id="${id}">${_baseOptions(f)}</select>`;
    } else {
      const t = f.type === "number" ? "number" : (f.type === "date" ? "date" : "text");
      control = `<input id="${id}" type="${t}"${f.type === "number" ? ' inputmode="numeric"' : ""}>`;
    }
    return `<div class="field" data-field="${f.name}">
      <label for="${id}">${esc(f.label)}${f.required ? " *" : ""}</label>${control}
    </div>`;
  }).join("");
  formSubmit.disabled = false; formSubmit.textContent = "Создать";
  sheetBackdrop.classList.add("open");
  sheet.classList.add("open");

  // wire dependent selects (project list follows the chosen client)
  for (const f of cfg.fields){
    if (!f.dependsOn) continue;
    const dep = document.getElementById("f_" + f.dependsOn);
    if (dep) dep.addEventListener("change", () => fillDynamic(f));
  }
  // populate dynamic option lists (projects self-disable until a client is picked)
  for (const f of cfg.fields){
    if (f.dynamic) await fillDynamic(f);
  }
}

function closeSheet(){
  sheet.classList.remove("open");
  sheetBackdrop.classList.remove("open");
}

async function submitForm(){
  const cfg = FORMS[activeFormKey()];
  if (!cfg || busy) return;
  const body = {};
  let valid = true;
  formFields.querySelectorAll(".field").forEach(w => w.classList.remove("bad"));
  for (const f of cfg.fields){
    const el = document.getElementById("f_" + f.name);
    const raw = (el.value || "").trim();
    if (f.required && !raw){
      el.closest(".field").classList.add("bad"); valid = false; continue;
    }
    if (raw === "") continue;
    if (f.type === "number" || f.coerce === "int"){
      const n = parseInt(raw, 10);
      if (!Number.isNaN(n)) body[f.name] = n;
    } else {
      body[f.name] = raw;
    }
  }
  if (!valid){ setFormError("Заполни обязательные поля"); return; }

  busy = true;
  formSubmit.disabled = true; formSubmit.textContent = "Сохранение…";
  setFormError("");
  try {
    await api(cfg.endpoint, { method:"POST", body });
    haptic("medium");
    closeSheet();
    toast("Создано");
    await load(currentTab);
  } catch(e){
    setFormError(e.message || "Не удалось сохранить");
    formSubmit.disabled = false; formSubmit.textContent = "Создать";
  } finally {
    busy = false;
  }
}

document.getElementById("fab").addEventListener("click", () => { haptic(); openSheet(); });
sheetBackdrop.addEventListener("click", closeSheet);
formSubmit.addEventListener("click", submitForm);

load("home");
</script>
</body>
</html>
